<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор модельної навчальної програми</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: sticky header with steps; step 1 = structure sidebar + outcome matrix; step 2 = topic list + 3-column table; drawer = activity reference */
  --bg:#f3f4f0; --panel:#ffffff; --ink:#1b2230; --muted:#5b6474; --line:#dcdfd8; --soft:#eceee8;
  --accent:#2a5885; --accent-soft:#e4edf6; --accent-ink:#ffffff;
  --warn:#a8650f; --warn-soft:#fbefda; --multi:#74479e; --multi-soft:#f0e8f7; --ok:#2e7650; --ok-soft:#e2f1e8;
  --g1:#2a5885; --g2:#2e7650; --g3:#b25f22; --g4:#8a4a8e;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13171e; --panel:#1b2029; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2e3542; --soft:#232935;
    --accent:#7fb0e0; --accent-soft:#1f2f42; --accent-ink:#0e1520;
    --warn:#e0a54f; --warn-soft:#3a2c17; --multi:#c29be6; --multi-soft:#2f2440; --ok:#6cc596; --ok-soft:#1b3226;
    --g1:#7fb0e0; --g2:#6cc596; --g3:#e59a62; --g4:#d08ad3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13171e; --panel:#1b2029; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2e3542; --soft:#232935;
  --accent:#7fb0e0; --accent-soft:#1f2f42; --accent-ink:#0e1520;
  --warn:#e0a54f; --warn-soft:#3a2c17; --multi:#c29be6; --multi-soft:#2f2440; --ok:#6cc596; --ok-soft:#1b3226;
  --g1:#7fb0e0; --g2:#6cc596; --g3:#e59a62; --g4:#d08ad3;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;min-height:100%}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.hbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px}
.brand{font:600 12px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
#title{flex:1 1 280px;min-width:200px;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 8px;font:600 18px/1.3 var(--display)}
#title:hover,#title:focus{border-color:var(--line);background:var(--bg)}
.hactions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.saved{font-size:12px;color:var(--muted);white-space:nowrap}
.steps{display:flex;gap:4px;padding:0 16px;overflow-x:auto}
.steps button{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
.steps button .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--soft);margin-right:6px;font-size:12px}
.steps button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.steps button[aria-selected="true"] .n{background:var(--accent);color:var(--accent-ink)}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;font-weight:500;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:3px 8px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{color:#b4372e}
.btn:disabled{opacity:.5;cursor:not-allowed}
.menu{position:relative}
.menu > summary{list-style:none}
.menu > summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;min-width:250px;display:flex;flex-direction:column;z-index:30}
.menu .pop button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px}
.menu .pop button:hover{background:var(--soft)}
.menu .pop .note{font-size:12px;color:var(--muted);padding:6px 10px}

main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.layout.narrow{grid-template-columns:44px minmax(0,1fr)}
@media (max-width:900px){.layout.narrow{grid-template-columns:1fr}}
.side.collapsed{padding:6px 2px;display:flex;justify-content:center}
.side.collapsed .vtoggle{writing-mode:vertical-rl;transform:rotate(180deg);padding:10px 4px;white-space:nowrap}
@media (max-width:900px){.side.collapsed .vtoggle{writing-mode:horizontal-tb;transform:none}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.side{padding:12px;position:sticky;top:110px;max-height:calc(100vh - 126px);overflow:auto}
@media (max-width:900px){.side{position:static;max-height:none}}
h2{font:600 15px/1.3 var(--display);margin:0;text-wrap:balance}
h3{font:600 14px/1.3 var(--body);margin:0}
.muted{color:var(--muted)}
.tiny{font-size:12px}

/* coverage strip */
.cov{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.covtop{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline}
.covtop .big{font:600 22px/1 var(--display);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:500;border:1px solid transparent;background:var(--soft)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.multi{background:var(--multi-soft);color:var(--multi)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
button.pill:hover{border-color:currentColor}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.gcard{border:1px solid var(--line);border-left:4px solid var(--gc);border-radius:6px;padding:8px 10px;background:var(--panel);text-align:left;display:flex;flex-direction:column;gap:4px}
.gcard[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--gc)}
.gcard .gk{font-weight:600;display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.gcard .gn{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:5px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gc)}

/* structure sidebar */
.mod{border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.mod .mh{display:flex;gap:4px;align-items:center}
.mod .mh input{flex:1;font-weight:600}
.tin{border:1px solid transparent;background:transparent;border-radius:5px;padding:3px 6px;min-width:0}
.tin:hover,.tin:focus{border-color:var(--line);background:var(--bg)}
.topic{display:flex;gap:2px;align-items:center;border-radius:6px;padding:2px}
.topic.active{background:var(--accent-soft)}
.topic .num{font-size:12px;color:var(--muted);width:30px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.topic input{flex:1}
.topic .cnt{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:22px;text-align:right}
.ib{border:0;background:none;width:24px;height:24px;border-radius:5px;color:var(--muted);flex:none;display:grid;place-items:center;font-size:14px;line-height:1}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib.armed{background:#b4372e;color:#fff}
.topic .ib.hv,.mod .mh .ib.hv{opacity:0}
.topic:hover .ib.hv,.topic:focus-within .ib.hv,.mod .mh:hover .ib.hv,.mod .mh:focus-within .ib.hv,.ib.hv.armed{opacity:1}
@media (hover:none){.ib.hv{opacity:1 !important}}

/* toolbar */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 12px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tools input[type=search],.tools select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 8px}
.tools input[type=search]{flex:1 1 200px;min-width:160px}

/* matrix */
.mwrap{overflow:auto;max-height:calc(100vh - 190px)}
table.mx{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:0}
.mx thead th{position:sticky;top:0;background:var(--panel);z-index:3;vertical-align:bottom}
.mx thead tr.mrow th{top:0;height:28px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);text-align:center;border-left:2px solid var(--line)}
.mx thead tr.trow th{top:28px}
.mx th.vt{width:38px;min-width:38px;height:170px;font-weight:500;font-size:12px;color:var(--ink)}
.mx th.vt div{writing-mode:vertical-rl;transform:rotate(180deg);max-height:160px;overflow:hidden;padding:6px 0;margin:0 auto;text-align:left;line-height:1.2}
.mx th.vt b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.mx th.vt.first,.mx td.first{border-left:2px solid var(--line)}
.mx th.cc,.mx td.cc{position:sticky;left:0;background:var(--panel);z-index:2}
.mx thead th.cc{z-index:4}
.mx td.cc{width:440px;min-width:440px;max-width:440px;padding:6px 10px;border-right:1px solid var(--line)}
.mx td.cc .code{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.mx td.cc .txt{font-size:13.5px}
.mx td.box{text-align:center;vertical-align:middle;cursor:pointer}
.mx td.box:hover{background:var(--accent-soft)}
.mx td.box input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;margin:0}
.mx td.tot{width:46px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;border-left:2px solid var(--line)}
.mx tr.none td.cc{box-shadow:inset 4px 0 0 var(--warn)}
.mx tr.none td.tot{color:var(--warn);background:var(--warn-soft)}
.mx tr.multi td.tot{color:var(--multi);background:var(--multi-soft)}
.mx tr.gh td{background:var(--soft);padding:6px 10px;font-weight:600;font-size:13px;position:sticky;left:0}
.mx tr.gh td span{color:var(--muted);font-weight:400}
.mx tr.kh td{padding:5px 10px 4px;font-size:12.5px;color:var(--muted);position:sticky;left:0;background:var(--panel);border-bottom:1px dashed var(--line)}
.mx tr.kh .kin{max-width:min(860px,80vw)}
.mx tr.kh td b,.okh b{font-weight:600;font-variant-numeric:tabular-nums}
.okh{padding:6px 12px 4px;font-size:12.5px;color:var(--muted);background:var(--bg);border-bottom:1px dashed var(--line)}
.gdot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--gc);margin-right:6px;vertical-align:-1px}
.empty{padding:36px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty p{max-width:52ch;margin:0}

/* by topic list */
.olist{display:flex;flex-direction:column}
.orow{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.orow:hover{background:var(--accent-soft)}
.orow input{width:17px;height:17px;margin-top:2px;accent-color:var(--accent)}
.orow .code{font-size:12px;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:11.5px;border-radius:4px;padding:1px 6px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.orow.none .code::after{content:"не охоплено";margin-left:8px;color:var(--warn);font-weight:500}

/* step 2 */
.tlist{display:flex;flex-direction:column;gap:2px}
.tlist .mt{font-size:12px;font-weight:600;color:var(--muted);margin:10px 4px 4px;text-transform:uppercase;letter-spacing:.03em}
.tlist button{display:grid;grid-template-columns:34px 1fr auto;gap:6px;align-items:center;border:0;background:none;text-align:left;padding:6px;border-radius:6px}
.tlist button:hover{background:var(--soft)}
.tlist button[aria-current="true"]{background:var(--accent-soft)}
.tlist .num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat{font-size:11.5px;border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums;background:var(--soft);color:var(--muted);white-space:nowrap}
.stat.done{background:var(--ok-soft);color:var(--ok)}
.stat.part{background:var(--warn-soft);color:var(--warn)}
.thead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.twrap{overflow-x:auto}
table.prog{border-collapse:collapse;width:100%;min-width:860px;table-layout:fixed}
.prog th{background:var(--soft);text-align:left;font-size:13px;padding:8px 10px;border:1px solid var(--line);font-weight:600}
.prog td{vertical-align:top;border:1px solid var(--line);padding:8px 10px}
.prog th:nth-child(1){width:36%}.prog th:nth-child(2){width:30%}
.prog .rn{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ocitem{border-left:3px solid var(--gc);padding:2px 0 2px 8px;margin-bottom:8px;font-size:13.5px}
.ocitem .code{font-weight:600;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;align-items:center}
.ocitem .ocact{display:flex;gap:2px;align-items:center}
.ocitem .ocact .ib{width:22px;height:22px;font-size:13px}
.edtag{font-size:11px;font-weight:600;color:var(--multi);background:var(--multi-soft);border-radius:4px;padding:0 5px;white-space:nowrap}
.ocedit textarea{width:100%;border:1px solid var(--accent);border-radius:6px;padding:6px 8px;background:var(--panel);font-size:13.5px;line-height:1.4}
.ocedit .ocbtns{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.ocitem select{font-size:12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:1px 2px;max-width:150px}
.prog textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--bg);resize:vertical;line-height:1.45}
.prog td{position:relative}
.acbox{position:absolute;left:10px;right:10px;z-index:15;background:var(--panel);border:1px solid var(--accent);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.15);margin-top:-4px;max-height:260px;overflow:auto}
.acbox .achd{font-size:11.5px;color:var(--muted);padding:5px 9px;border-bottom:1px solid var(--line)}
.acbox .acit{padding:6px 9px;font-size:13.5px;cursor:pointer;line-height:1.35}
.acbox .acit.on,.acbox .acit:hover{background:var(--accent-soft)}
.prog textarea:focus{background:var(--panel)}
.sugg{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.sugg .lab{font-size:12px;color:var(--muted);margin-right:2px}
.schip{text-align:left;border:1px dashed var(--accent);color:var(--accent);background:none;border-radius:999px;padding:2px 9px;font-size:12.5px}
.schip:hover{background:var(--accent-soft);border-style:solid}
.schip.bank{border-color:var(--ok);color:var(--ok);text-align:left}
.schip.bank:hover{background:var(--ok-soft)}
.schip.kn{border-color:var(--g3);color:var(--g3)}
.schip.kn:hover{background:var(--warn-soft)}
.ksuggs .sugg{margin-top:6px}
.knsec{font-weight:600;margin:14px 0 6px;font-size:13.5px}
.kitem{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:6px 8px;border-radius:6px;border:1px solid transparent}
.kitem:hover{background:var(--soft)}
.kitem.fit{border-color:var(--g3);background:var(--warn-soft)}
.kitem .used{font-size:11.5px;color:var(--ok);font-weight:600;margin-left:6px;white-space:nowrap}
.suggs .sugg{margin-top:6px}
.ocst{display:flex;gap:6px;align-items:center;font-size:12px;margin-top:4px}
.ocst.warn{color:var(--warn)} .ocst.low{color:var(--multi)} .ocst.ok{color:var(--ok)}
.lv{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:4px;font-size:11px;font-weight:700;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.lv1{background:#e8ecef;color:#55606b} .lv2{background:var(--accent-soft);color:var(--accent)} .lv3{background:var(--ok-soft);color:var(--ok)} .lv4{background:var(--multi-soft);color:var(--multi)}
.links{margin-top:8px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg)}
.links .lh{font-size:12px;font-weight:600;margin-bottom:4px}
.lrow{display:grid;grid-template-columns:auto 1fr;gap:2px 6px;align-items:start;padding:4px 0;border-top:1px dashed var(--line);font-size:12.5px}
.lrow:first-of-type{border-top:0}
.lrow .lc{grid-column:2;display:flex;flex-wrap:wrap;gap:3px}
.lrow.nolink .lt::after{content:" · не прив’язано";color:var(--warn);font-weight:500}
.lchip{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:0 5px;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.lchip.hint{border:1.5px dashed var(--accent);color:var(--accent)}
.lchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.amx{margin:14px 16px;border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.amx summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
table.am{border-collapse:collapse;margin-top:10px;font-size:12.5px}
.am th,.am td{border:1px solid var(--line);padding:3px 5px;text-align:center}
.am td:first-child,.am th:first-child{text-align:left;min-width:280px;max-width:420px}
.am th div{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:500;font-size:11.5px;margin:0 auto}
.am td.off{background:var(--soft)}
.am .lchip.dot{width:22px;height:20px;padding:0;border-radius:50%}
.am tr.sum td{font-weight:600} .am td.zero{color:var(--warn);background:var(--warn-soft)}
.asec{padding:12px 16px;border-bottom:1px solid var(--line)}
.asec h3{margin-bottom:8px}
.asec textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--bg)}
.grbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.strats{display:flex;flex-direction:column;gap:10px}
.strat{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:6px 14px;align-items:start}
@media (max-width:900px){.strat{grid-template-columns:1fr}}
.strat .sn{font-size:13.5px}
.tchips{display:flex;flex-wrap:wrap;gap:5px}
.tchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:13px}
.tchip.rec{border-color:var(--g3)}
.tchip.fa{background:var(--bg);border-style:dashed}
.tchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.acov{margin:4px 0 0}
.acovbox > summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;list-style:none}
.acovbox > summary::-webkit-details-marker{display:none}
.acovbox > summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.acovbox[open] > summary::before{transform:rotate(90deg)}
.acovbox .sumhint{margin-left:auto;text-decoration:underline}
.am tr.grmod td{background:var(--soft);font-weight:600;text-align:left}
.am tr.grsub td{font-weight:600;border-top:2px solid var(--line)}
.am tr.cur td{outline:0;background:var(--accent-soft)}
.am td.grc{background:color-mix(in srgb, var(--accent) calc(var(--a)*30%), transparent);font-variant-numeric:tabular-nums}
.am td.zero0{color:var(--muted)}
.grsum{margin:10px 12px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.35);z-index:40}

.db{overflow:auto;padding:8px 16px 24px;flex:1}

.act .af{grid-column:1;display:flex;gap:4px;flex-wrap:wrap}

.badge{font-size:11px;font-weight:600;color:var(--accent);margin-left:6px}
.addown{border-top:1px solid var(--line);padding-top:12px;margin-top:16px;display:flex;flex-direction:column;gap:6px}
.addown input,.addown textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(10,14,20,.4)}
.mbox{background:var(--panel);border-radius:10px;border:1px solid var(--line);width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column}
.mbox .mhd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.mbox .mbd{padding:14px 18px;display:flex;flex-direction:column;gap:12px}

.stdgo{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:flex-end;margin-top:10px}
.stdgo label{font-size:13.5px;display:flex;gap:6px;align-items:center}
.mbox textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:6px;padding:8px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg)}
.drop{border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.srcs{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;padding:10px 18px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.panel > .srcs{border-top:0}
.srcs a{color:var(--accent)}
.start{padding:24px}
.starthd{max-width:760px;margin-bottom:18px}
.starthd h2{font-size:20px;margin-bottom:6px}
.starthd p{margin:0}
.startgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.startcard{display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:18px;cursor:pointer}
.startcard:hover{border-color:var(--accent);background:var(--accent-soft)}
.startcard b{font:600 15px/1.3 var(--display)}
.startcard span:not(.sn){font-size:13.5px;color:var(--muted)}
.startcard .sn{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700}
.hintbar{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:9px 12px}
.hintbar p{margin:0;flex:1;font-size:13.5px;max-width:110ch}
.hintbar > button{margin-left:auto;flex:none}
.hintbar .hi{flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;font-style:italic;font-family:Georgia,serif}
.prog th .thsub{font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.stdbox{border:1px solid var(--line);border-radius:8px;padding:12px}
.stdbox h3{margin-bottom:8px}
.stdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.stdgrid label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:7px 9px;cursor:pointer}
.stdgrid label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.dxin{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel);font-weight:600}
.res{background:var(--soft);border-radius:6px;padding:10px 12px;font-size:13.5px}
.res ul{margin:6px 0 0;padding-left:18px}
.opts{display:flex;flex-direction:column;gap:6px}
.opts label{display:flex;gap:8px;align-items:flex-start}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:90vw}
[hidden]{display:none !important}
@media (prefers-reduced-motion:no-preference){.btn,.gcard,.schip{transition:background .12s,border-color .12s}}
</style>
</head>

<div class="app">

        </div>
      </details>
      <details class="menu" id="mExp"><summary class="btn">Експорт ▾</summary>

    </div>
  </div>
  <nav class="steps" role="tablist">

    <button role="tab" data-step="3"><span class="n">3</span>Планування оцінювання</button>
    <button role="tab" data-step="4"><span class="n">4</span>Перегляд програми</button>
  </nav>
</header>
<main id="main"></main>
</div>

<script>
"use strict";
const SEED = null;
const STD = {"zr":{"1":"Робота з інформацією, даними, моделями","2":"Створення інформаційних продуктів","3":"Робота у цифровому середовищі","4":"Безпечна та відповідальна робота з інформаційними технологіями"},"zor":{"1.1":"Досліджує і оцінює вплив інформаційних технологій на своє життя, навколишній світ і розвиток","1.2":"Знаходить, збирає, зберігає, представляє, перетворює, структурує, аналізує і узагальнює дані різних типів","1.3":"Будує інформаційні моделі об'єктів, явищ і процесів","1.4":"Критично оцінює інформацію, отриману з різних джерел","2.1":"Розробляє і реалізовує алгоритми","2.2":"Створює і налагоджує програмні проєкти","2.3":"Розробляє модульні проєкти","2.4":"Створює та опрацьовує інформаційні продукти з використанням даних різних типів","2.5":"Співпрацює в команді для створення інформаційного продукту","3.1":"Використовує широкий спектр цифрових пристроїв","3.2":"Організовує власне інформаційне середовище","3.3":"Використовує комунікаційні технології та мережі для власного розвитку, спілкування і співпраці","4.1":"Обґрунтовує вплив технологій на навколишнє середовище і власний добробут, захищає себе і свій інформаційний простір","4.2":"Усвідомлено дотримується норм соціальної, міжкультурної і міжособистісної взаємодії","4.3":"Усвідомлено дотримується норм правової взаємодії"},"kor":{"2 ІФО 1.1.1":"досліджує, як людина сприймає інформацію за допомогою органів чуття","4 ІФО 1.1.1":"досліджує основні інформаційні процеси у близькому для себе середовищі (дім, школа, вулиця) на основі власного досвіду","6 ІФО 1.1.1":"пояснює призначення і використовує цифрові пристрої і технології для здійснення інформаційних процесів у повсякденному житті та навчальній діяльності","6 ІФО 1.1.2":"обирає цифрові пристрої та/чи інформаційні технології для розв'язання задачі","6 ІФО 1.1.3":"висловлює міркування щодо сучасних інформаційних технологій і їх місця в суспільстві","9 ІФО 1.1.1":"розпізнає та формулює задачі з різних предметних галузей і життєвих ситуацій, для розв /* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 9);
const CODE_RE = /^\s*(\d{1,2})\s*([А-ЯІЇЄҐA-Z]{2,5})\s*(\d+)\s*\.\s*(\d+)\s*\.\s*(\d+)\s*([-–—.])\s*(\d+)(\s*П(?![а-яіїєґ]))?/u;
function parseCode(s){
  const m = String(s).match(CODE_RE); if(!m) return null;
  const dot = m[6]===".", adv = !!m[8];
  const code = `${m[1]} ${m[2]} ${m[3]}.${m[4]}.${m[5]}${dot?".":"-"}${m[7]}${adv?" П":""}`;
  return {code, len:m[0].length, cyc:+m[1], subj:m[2], g:+m[3], lvl: adv?"П":(dot?"О":""), kor:`${m[1]} ${m[2]} ${m[3]}.${m[4]}.${m[5]}`, p:[+m[3],+m[4],+m[5],+m[7]]};
}
const gkey = code => { const p = parseCode(code); return p ? `${p.cyc} ${p.subj} ${p.g}${p.lvl?" "+p.lvl:""}` : "Інше"; };
const gcolor = k => { const n = parseInt(k.split(" ")[2],10); return `var(--g${((isNaN(n)?1:n)-1)%4+1})`; };
const korOf = code => parseCode(code)?.kor || "";
const korText = code => STD?.kor?.[korOf(code)] || "";
const norm = s => String(s).toLowerCase().replace(/['ʼ`]/g,"’");
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true, 3200); }

/* two-click confirm for destructive buttons */
function armed(btn){
  if(btn.dataset.armed){ return true; }
  btn.dataset.armed="1"; btn.classList.add("armed"); const old=btn.textContent;
  if(btn.dataset.confirm) btn.textContent = btn.dataset.confirm;
  setTimeout(()=>{ delete btn.dataset.armed; btn.classList.remove("armed"); if(btn.dataset.confirm) btn.textContent=old; }, 3000);
  return false;
}

/* ---------- state ---------- */
function blankState(){
  return {v:STATE_V, title:"Нова модельна навчальна програма", groupNames:{}, outcomes:[], modules:[{id:uid("m"),name:"Модуль 1",topics:[]}], assign:{}, rows:{}, ui:{step:1, view:"matrix", active:null, t2:null, filter:"all", group:"", q:""}};
}
function seedState(){
  if(!SEED) return blankState();
  const s = blankState();
  s.v = STATE_V;
  s.title = SEED.title;
  s.outcomes = SEED.outcomes.map(([c,t])=>({c,t}));
  s.modules = SEED.modules.map(m=>({id:m.id,name:m.name,topics:m.topics.map(t=>({id:t.id,name:t.name}))}));
  s.assign = SEED.assign;
  s.ui.active = s.modules[0]?.topics[0]?.id || null;
  return s;
}
let S;
try { const raw = localStorage.getItem(LS_KEY); S = raw ? JSON.parse(raw) : null; } catch(e){ S = null; }
if(!S || !S.outcomes) S = seedState();
S.ui = Object.assign(blankState().ui, S.ui || {});
delete S.dir; delete S.customActs; S.groupNames = S.groupNames || {}; S.rows = S.rows || {};
function migrate(){ if((S.v||1) < 2){
  // v2: the ТЕО outcomes were only an example; texts of ІФО outcomes follow the standard
  S.outcomes = S.outcomes.filter(o=>!/\sТЕО\s/.test(o.c));
  const std = new Map(STD ? Object.values(STD.sets).flat() : []);
  for(const o of S.outcomes) if(std.has(o.c)) o.t = std.get(o.c);
  if(SEED && /Вступ до робототехніки/.test(S.title||"")) S.title = SEED.title;
  S.v = STATE_V; cleanAssign();
} }

let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); $("#saved").textContent = "Збережено в браузері · " + new Date().toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"}); }
    catch(e){ $("#saved").textContent = "Автозбереження недоступне: збережіть файл проєкту"; }
  }, 300);
}

/* derived */
const allTopics = () => S.modules.flatMap((m,mi)=>m.topics.map((t,ti)=>({...t, m, mi, ti, num:`${mi+1}.${ti+1}`})));
const topicById = id => allTopics().find(t=>t.id===id);
const assigned = code => (S.assign[code]||[]).filter(id=>topicById(id));
const topicOutcomes = tid => S.outcomes.filter(o=>(S.assign[o.c]||[]).includes(tid));
function groups(){
  const map = new Map();
  for(const o of S.outcomes){ const k=gkey(o.c); if(!map.has(k)) map.set(k,[]); map.get(k).push(o); }
  return [...map.entries()].map(([k,list])=>({k,list}));
}
const gname = k => S.groupNames[k] ?? DEFAULT_GROUP_NAMES[k.split(" ").slice(1,3).join(" ")] ?? "";
const glabel = k => { const p=k.split(" "); if(p.length<3) return k; return `${p[0]} ${p[1]} · ГР ${p[2]}` + (p[3]==="П"?" · поглиблений":p[3]==="О"?" · основний":""); };
function cleanAssign(){
  const ids = new Set(allTopics().map(t=>t.id)); const codes = new Set(S.outcomes.map(o=>o.c));
  for(const c of Object.keys(S.assign)){ if(!codes.has(c)){ delete S.assign[c]; continue; } S.assign[c]=S.assign[c].filter(id=>ids.has(id)); if(!S.assign[c].length) delete S.assign[c]; }
  for(const tid of Object.keys(S.rows)){ if(!ids.has(tid)) delete S.rows[tid]; }
}

/* ---------- rendering: shell ---------- */
function render(){
  $("#title").value = S.title;
  document.querySelectorAll(".steps button").forEach(b=>b.setAttribute("aria-selected", String(+b.dataset.step===S.ui.step)));
  if(S.ui.step===1) renderStep1(); else if(S.ui.step===2) renderStep2(); else if(S.ui.step===3) renderAssess(); else renderStep3();
}

function filteredOutcomes(){
  const q = norm(S.ui.q||"").trim();
  return S.outcomes.filter(o=>{
    if(S.ui.group && gkey(o.c)!==S.ui.group) return false;
    const n = assigned(o.c).length;
    if(S.ui.filter==="none" && n) return false;
    if(S.ui.filter==="multi" && n<2) return false;
    if(S.ui.filter==="some" && !n) return false;
    if(q && !norm(o.c+" "+o.t).includes(q)) return false;
    return true;
  });
}

function outLevel(code){ const t=norm(ocText(code)); for(const [l,vs] of OUT_VERBS) if(vs.some(v=>t.includes(v))) return l; return 0; }
function actLevel(line){
  const n=norm(line); const g=allActs().find(a=>norm(a.n)===n.replace(/\.$/,"")); if(g && g.lvl) return g.lvl;
  const head=n.split(/[\s,.]+/).slice(0,3).join(" ");

  return {L, per};
}

/* link hints: only where the wording of an activity and an outcome clearly share specific words */
const LK_STOP=new Set(["основ","різни","власн","інших","також","метою","метод","спосо","викор","засто","створ","робот","прост","певни","задач","задан","різно","можли","засоб","особл","обран","навча","відпо","прикл","навод","поясн","визна","опису","розпі","предм","галуз","потре","допом","вплив","сприя","зокре","можна","оціню","дослі","розро","порів","викон","тощо","форма","предс","резул","корис"]);
const lkWords = t => [...new Set((norm(t).match(/[a-zа-яіїєґ’]{4,}/g)||[]).map(w=>w.slice(0,5)).filter(w=>!LK_STOP.has(w)))];
let LK_DF=null, LK_N=0;
function lkDF(){ if(LK_DF && LK_N===S.outcomes.length) return LK_DF; LK_DF=new Map(); LK_N=S.outcomes.length; for(const o of S.outcomes) for(const w of lkWords(o.t)) LK_DF.set(w,(LK_DF.get(w)||0)+1); return LK_DF; }
function linkHints(r){
  const out=new Map(); if(r.oc.length<2) return out;
  const df=lkDF(); const lim=Math.max(3, LK_N*0.08);           // words found in more than ~8% of outcomes are too general
  const oW=new Map(r.oc.map(c=>[c, new Set(lkWords(ocText(c)).filter(w=>(df.get(w)||0)<=lim))]));
  actLines(r).forEach((t,i)=>{ const aw=lkWords(t); const hit=new Map();
    for(const [c,ws] of oW){ const sh=aw.filter(w=>ws.has(w)); if(sh.length>=3 || (sh.length>=2 && sh.some(w=>(df.get(w)||0)<=3))) hit.set(c,sh); }
    if(hit.size && hit.size<r.oc.length) out.set(i,hit); });   // a hint that fits every outcome of the row says nothing
  return out;
}

/* ---------- import of a whole programme from Word (.docx), read in the browser ---------- */
const WNS="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
const wkids=(el,name)=>[...el.childNodes].filter(n=>n.nodeType===1 && n.namespaceURI===WNS && (!name||n.localName===name));
function wText(el){ let t=""; const walk=n=>{ for(const c of n.childNodes){ if(c.nodeType!==1) continue; const ln=c.localName;
    if(ln==="t") t+=c.textContent; else if(ln==="tab") t+="\t"; else if(ln==="br"||ln==="cr") t+="\n"; else if(ln==="p"){ if(t && !t.endsWith("\n")) t+="\n"; walk(c); } else if(ln!=="tbl") walk(c); } };

function docxItems(body){
  const out=[]; const walk=el=>{ for(const n of wkids(el)){ if(n.localName==="p") out.push({k:"p", t:wText(n).replace(/\s+/g," ").trim()});
      else if(n.localName==="tbl") out.push({k:"t", rows:wkids(n,"tr").map(tr=>wkids(tr,"tc").map(tc=>wText(tc)))});
      else if(n.localName==="sdt"){ const c=wkids(n,"sdtContent")[0]; if(c) walk(c); } } };

const joinLines = txt => { const out=[]; for(const raw of String(txt||"").split("\n")){ const l=raw.trim(); if(!l) continue;
    if(out.length && !/[.!?:;)»"]$/.test(out[out.length-1]) && (/^[a-zа-яіїєґ(]/.test(l))) out[out.length-1]+=" "+l; else out.push(l); }

const startsCont = s => !!s && /^[a-zа-яіїєґ0-9\[(,;]/.test(s);
function docxProgramme(items){
  const mods=[]; let mod=null, topic=null, seen=false, lastNum=0, title="";
  for(const it of items){
    if(it.k==="p"){
      const t=it.t; if(!t) continue;
      if(!title){ const q=t.match(/«([^»]{3,120})»/); if(q) title=q[1]; }
      if(t.length<=80){
        let m=t.match(/(\d{1,2})\s*[-–]?\s*(?:й\s*)?клас\s*$/i), name=null;
        if(m){ lastNum=+m[1]; name=`${m[1]} клас`; }
        else if(/^клас$/i.test(t) && lastNum){ lastNum++; name=`${lastNum} клас`; }
        else if(/^модуль\s*\d+/i.test(t)){ name=t; }
        else if(seen && /^(ІІІ|III)\.|прикінцева частина|список використаних/i.test(t)){ seen="end"; }
        if(name && seen!=="end"){ mod={name, topics:[]}; mods.push(mod); topic=null; }
      }
      continue;
    }
    if(seen==="end") continue;
    const rows=it.rows; if(!rows.length) continue;
    const h0=rows[0];
    if(h0.length>1 && /^(ІФО|ТЕО)\s*\d$/.test((h0[1]||"").trim())) continue;          // criteria tables
    const hasHeader = rows.some(r=>/^очікувані результати/i.test((r[0]||"").trim()));
    if(!seen && !hasHeader) continue;                                                   // tables before the programme
    seen=true; if(!mod){ mod={name:"Модуль 1", topics:[]}; mods.push(mod); }
    let first=true;
    for(const r of rows){
      const cells=r.map(x=>x.trim());
      if(cells.length===1 || cells.every(x=>x===cells[0])){ const t=cells[0]; if(t && !/^очікувані/i.test(t)){ topic={name:t.replace(/\s+/g," "), rows:[]}; mod.topics.push(topic); } first=false; continue; }
      if(cells.length<3){ first=false; continue; }
      const [a,b,c]=cells;
      if(/^очікувані/i.test(a)){ first=false; continue; }
      if(!topic){ topic={name:"Тема без назви", rows:[]}; mod.topics.push(topic); }
      const cont = first && topic.rows.length && ([a,b,c].some(startsCont) || (!b && !c));
      if(cont){ const pr=topic.rows[topic.rows.length-1]; [a,b,c].forEach((s,i)=>{ if(s) pr[i]=(pr[i]+(startsCont(s)?" ":"\n")+s).trim(); }); }

/* similarity of two wordings (character bigrams) for programmes without indices */
function bigrams(s){ s=norm(s).replace(/[^a-zа-яіїєґ’0-9 ]/g,"").replace(/\s+/g," "); const m=new Map(); for(let i=0;i<s.length-1;i++){ const g=s.slice(i,i+2); m.set(g,(m.get(g)||0)+1); } return m; }

const ANY_CODE = /(\d{1,2})\s*ІФО\s*(\d+)\s*\.\s*(\d+)\s*\.\s*(\d+)\s*([-–.])\s*(\d+)(\s*П(?![а-яіїєґ]))?/g;

  let codesFound=0; for(const m of prog.mods) for(const t of m.topics) for(const r of t.rows){ ANY_CODE.lastIndex=0; if(ANY_CODE.test(r[0])) codesFound++; }
  const useFuzzy = codesFound===0;

  for(const m of prog.mods) for(const t of m.topics){ t.out=[]; for(const [a,b,c] of t.rows){ nRows++; const codes=[];
      if(!useFuzzy){
        ANY_CODE.lastIndex=0; let mm, prev=0; while((mm=ANY_CODE.exec(a))){ const p=parseCode(mm[0].replace(/\s+/g," ")); if(!p){ prev=ANY_CODE.lastIndex; continue; } codes.push(p.code);   // an index may be broken over two lines
            if(!known.has(p.code) && !texts.has(p.code)){ const tx=a.slice(prev,mm.index).split("\n").filter(Boolean).pop()?.replace(/[\[\s;,.]+$/,"").replace(/^[\]\s;,.]+/,"").trim(); if(tx) texts.set(p.code,tx); }
            prev=ANY_CODE.lastIndex; }
      } else {

          const bg=bigrams(line); let best=null, bs=0; for(const [code,g] of setBg){ const s=dice(bg,g); if(s>bs){ bs=s; best=code; } }

  const outcomes=[]; for(const k of sets) for(const [c,t] of STD.sets[k]) outcomes.push({c,t});
  const have=new Set(outcomes.map(o=>o.c)); const missing=[];
  for(const c of used) if(!have.has(c)){ const t=known.get(c)||texts.get(c); if(t){ outcomes.push({c,t}); have.add(c); } else missing.push(c); }
  return {useFuzzy, nRows, nOc, unmatched, outcomes:sortOutcomes(outcomes), missing, sets:[...sets]};
}
function buildProject(prog, an, title){
  const P=blankState(); P.title=title||prog.title||"Імпортована програма"; P.outcomes=an.outcomes; P.modules=[]; P.assign={}; P.rows={};
  const valid=new Set(an.outcomes.map(o=>o.c));
  for(const m of prog.mods){ const M={id:uid("m"), name:m.name, topics:[]}; P.modules.push(M);
    for(const t of m.topics){ const T={id:uid("t"), name:t.name}; M.topics.push(T); const seenOc=new Set(); const rows=[];
      for(const r of t.out){ const oc=r.oc.filter(c=>valid.has(c) && !seenOc.has(c)); oc.forEach(c=>seenOc.add(c));
        for(const c of oc){ (P.assign[c]=P.assign[c]||[]); if(!P.assign[c].includes(T.id)) P.assign[c].push(T.id); }
        if(oc.length||r.content||r.act) rows.push({id:uid("r"), oc, content:r.content, act:r.act, links:{}}); }

}

const END_RE = /^([\s\S]*?)\s*\[\s*([^\[\]]+?)\s*\]\s*[;.,]?\s*$/;
function findCode(v){
  const s=String(v).trim(); if(!s) return null;
  const m=s.match(END_RE); if(m){ const q=parseCode(m[2]); if(q) return {p:q, text:m[1].trim()}; }
  const p=parseCode(s); if(p) return {p, text:s.slice(p.len).replace(/^[\s:–—.\-]+/,"").trim()};
  return null;
}
function parseGrid(rows){
  const out=[]; const seen=new Set(); let first=-1, textCol=-1;
  rows.forEach((r,ri)=>{
    for(let i=0;i<r.length;i++){
      const v=r[i]; if(typeof v!=="string") continue; const f=findCode(v); if(!f) continue; const p=f.p;
      let text = f.text; let tc=i;
      const okCell = w => typeof w==="string" && w.trim() && !w.trim().startsWith("=") && !findCode(w);
      if(!text){ for(let j=i+1;j<r.length;j++){ if(okCell(r[j])){ text=r[j].trim(); tc=j; break; } } }
      if(!text){ for(let j=i-1;j>=0;j--){ if(okCell(r[j])){ text=r[j].trim(); tc=j; break; } } }
      if(text && !seen.has(p.code)){ seen.add(p.code); out.push({c:p.code,t:text.replace(/\s+/g," "),ri}); if(first<0){first=ri; textCol=tc;} }
      break;
    }
  });
  // detect topic matrix (boolean columns), as in a spreadsheet with TRUE/FALSE per topic
  let topics=null;
  if(out.length && first>0){
    const hdr = rows[first-1]||[]; const above = rows[first-2]||[];
    const width = Math.max(...rows.map(r=>r.length));
    const cols=[];
    for(let c=textCol+1;c<width;c++){
      let bools=0; for(const o of out){ const v=(rows[o.ri]||[])[c]; if(v===true||v===false) bools++; }
      const name = typeof hdr[c]==="string" ? hdr[c].trim() : "";
      if(bools>out.length*0.5 && name) cols.push({c,name});
    }
    if(cols.length){
      const mods=[]; let prev=-9;
      for(const col of cols){
        if(col.c!==prev+1){ let mname=""; for(let k=col.c;k>=Math.max(0,col.c-1);k--){ if(typeof above[k]==="string"&&above[k].trim()){ mname=above[k].trim(); break; } } mods.push({name:mname||`Модуль ${mods.length+1}`, topics:[]}); }
        mods[mods.length-1].topics.push(col); prev=col.c;
      }
      const marks={}; for(const o of out){ const r=rows[o.ri]; marks[o.c]=[]; mods.forEach((m,mi)=>m.topics.forEach((t,ti)=>{ if(r[t.c]===true) marks[o.c].push(`${mi}.${ti}`); })); }
      topics={mods, marks};
    }
  }
  return {out, topics};
}
function parseText(txt){
  const rows = txt.split(/\r?\n/).map(l=>l.includes("\t") ? l.split("\t") : [l]);
  // merge continuation lines (text wrapped to the next line without a code)
  const lines0 = rows.map(r=>r.join(" ").trim()).filter(Boolean);
  const endStyle = lines0.filter(l=>{ const m=l.match(END_RE); return m && parseCode(m[2]); }).length >= lines0.filter(l=>parseCode(l)).length && lines0.some(l=>{ const m=l.match(END_RE); return m && parseCode(m[2]); });
  const merged=[];
  if(endStyle){
    // "text [index]": lines without an index are the beginning of the next outcome (wrapped text)
    let buf=""; for(const l of lines0){ const m=l.match(END_RE); if(m && parseCode(m[2])){ merged.push([(buf+" "+l).trim()]); buf=""; } else buf=(buf+" "+l).trim(); }
  } else {
    for(const r of rows){ const j=r.join(" ").trim(); if(!j) continue; if(findCode(j)||!merged.length) merged.push(r); else { const last=merged[merged.length-1]; last[last.length-1] = (last[last.length-1]||"")+" "+j; } }
  }
  return parseGrid(merged);
}
function sortOutcomes(list){
  const subjOrder=[]; for(const o of list){ const p=parseCode(o.c); if(p && !subjOrder.includes(p.cyc+" "+p.subj)) subjOrder.push(p.cyc+" "+p.subj); }
  return list.slice().sort((a,b)=>{ const x=parseCode(a.c), y=parseCode(b.c); if(!x||!y) return 0;
    const sx=subjOrder.indexOf(x.cyc+" "+x.subj), sy=subjOrder.indexOf(y.cyc+" "+y.subj); if(sx!==sy) return sx-sy;
    if(x.lvl!==y.lvl) return (x.lvl==="П")-(y.lvl==="П");
    for(let i=0;i<4;i++){ if(x.p[i]!==y.p[i]) return x.p[i]-y.p[i]; } return 0; });
}

async function readFile(file){

async function exportDOCX(){
  if(!window.docx){ toast("Бібліотека Word не завантажилася. Скористайтеся кнопкою «Копіювати таблиці» на кроці 3."); return; }
  const D=window.docx; const FONT="Times New Roman";
  const P = (runs, o={}) => new D.Paragraph({children:runs, spacing:{after:60}, ...o});
  const R = (text, o={}) => new D.TextRun({text, font:FONT, size:22, ...o});
  const W=[5200,4685,4685];
  const cell = (children, i, head) => new D.TableCell({children, width:{size:W[i],type:D.WidthType.DXA}, shading: head?{fill:"E4EDF6",type:D.ShadingType.CLEAR,color:"auto"}:undefined, margins:{top:60,bottom:60,left:100,right:100}});
  const txtCell = (s,i) => cell((lines(s).length?lines(s):[""]).map(l=>P([R(l)])), i);
  const children=[ new D.Paragraph({children:[R(S.title,{bold:true,size:30})], alignment:D.AlignmentType.CENTER, spacing:{after:240}}) ];
  for(const m of S.modules){
    if(!m.topics.length) continue;
    children.push(new D.Paragraph({children:[R(m.name,{bold:true,size:26})], spacing:{before:240,after:120}}));
    const trows=[new D.TableRow({tableHeader:true, children:["Очікувані результати навчання","Пропонований зміст","Види навчальної діяльності"].map((h,i)=>cell([P([R(h,{bold:true})])],i,true))})];
    for(const t0 of m.topics){
      const t=topicById(t0.id); ensureRows(t.id); const rows=S.rows[t.id].filter(r=>r.oc.length);
      trows.push(new D.TableRow({cantSplit:true, children:[new D.TableCell({columnSpan:3, children:[P([R(`Тема ${t.num}. ${t.name}`,{bold:true})])], shading:{fill:"F1F2EE",type:D.ShadingType.CLEAR,color:"auto"}, margins:{top:60,bottom:60,left:100,right:100}})]}));
      if(!rows.length){ trows.push(new D.TableRow({children:[new D.TableCell({columnSpan:3, children:[P([R("До теми ще не добрано орієнтирів.",{italics:true})])], margins:{top:60,bottom:60,left:100,right:100}})]})); continue; }
      for(const r of rows) trows.push(new D.TableRow({children:[ cell(r.oc.map(c=>P([R(`${ocTT(t.id,c)} [${c}]`)])),0), txtCell(r.content,1), txtCell(r.act,2) ]}));
    }
    children.push(new D.Table({rows:trows, width:{size:14570,type:D.WidthType.DXA}, columnWidths:W}));
  }
  if(S.modules.some(m=>m.topics.some(t=>assessText(t.id)))){
    children.push(new D.Paragraph({children:[R("Планування оцінювання",{bold:true,size:26})], spacing:{before:360,after:160}, pageBreakBefore:true}));
    const AW=[3800,5385,5385];
    const acell=(children,i,opt={})=>new D.TableCell({children, width:{size:AW[i],type:D.WidthType.DXA}, margins:{top:60,bottom:60,left:100,right:100}, ...opt});
    const arows=[new D.TableRow({tableHeader:true, children:["Тема","Формувальне оцінювання","Підсумкове оцінювання"].map((h,i)=>acell([P([R(h,{bold:true})])],i,{shading:{fill:"E4EDF6",type:D.ShadingType.CLEAR,color:"auto"}}))})];
    for(const m of S.modules){ const ts=m.topics.filter(t=>topicOutcomes(t.id).length); if(!ts.length) continue;
      arows.push(new D.TableRow({children:[new D.TableCell({columnSpan:3, children:[P([R(m.name,{bold:true})])], shading:{fill:"F1F2EE",type:D.ShadingType.CLEAR,color:"auto"}, margins:{top:60,bottom:60,left:100,right:100}})]}));
      for(const t0 of ts){ const t=topicById(t0.id); const at=assessText(t.id)||{f:[],s:[],note:""};
        const sumP = at.s.map(([g,l])=>P([R(`ГР ${g}: `,{bold:true}), R(l.join(", ").toLowerCase())])).concat(at.note?[P([R(at.note)])]:[]);
        arows.push(new D.TableRow({children:[ acell([P([R(`Тема ${t.num}. ${t.name}`)])],0), acell((at.f.length?at.f:[""]).map(x=>P([R(x)])),1), acell(sumP.length?sumP:[P([R("")])],2) ]})); } }
    children.push(new D.Table({rows:arows, width:{size:14570,type:D.WidthType.DXA}, columnWidths:AW}));
  }
  const doc = new D.Document({sections:[{properties:{page:{size:{orientation:D.PageOrientation.LANDSCAPE}, margin:{top:1134,bottom:1134,left:1134,right:1134}}}, children}]});
  const blob = await D.Packer.toBlob(doc);
  saveFile(fname("docx"), blob);
}
async function copyTables(){
  const el=$("#prev"); if(!el) return;
  const html = `<meta charset="utf-8"><style>table{border-collapse:collapse}td,th{border:1px solid #999;padding:4px 6px;vertical-align:top}</style>`+el.innerHTML;
  try{ await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([el.innerText],{type:"text/plain"})})]); toast("Скопійовано. Вставте в Word чи Google Документи."); }
  catch(e){ const rng=document.createRange(); rng.selectNodeContents(el); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(rng); try{ document.execCommand("copy"); toast("Скопійовано. Вставте в Word чи Google Документи."); }catch(_){ toast("Таблиці виділено: натисніть Ctrl+C."); } }
}

/* autocomplete: similar wordings from the directory while the author types an activity */
let AC=null;
function acCurrentLine(ta){ const v=ta.value, p=ta.selectionStart; const a=v.lastIndexOf("\n",p-1)+1; let e=v.indexOf("\n",p); if(e<0) e=v.length; return {a,e,text:v.slice(a,e)}; }
function acFind(text){
  const STOPW=new Set(["щодо","який","яких","також","через","після","перед","своїх","свого","своєї"]);
  const words=(norm(text).match(/[a-zа-яіїєґ’0-9]{4,}/g)||[]).filter(w=>!STOPW.has(w)); if(!words.length) return [];
  const q=norm(text).trim();
  return allActs().map(a=>{ const n=norm(a.n); if(n===q) return null; const nw=n.match(/[a-zа-яіїєґ’0-9]+/g)||[];
      let s=0; for(const w of words){ const st=w.slice(0,Math.max(3,w.length-2)); if(nw.some(x=>x.startsWith(st))) s+=1; }
      if(n.includes(q)) s+=2; return s? {a, s:s/words.length + (n.startsWith(q)?0.5:0)} : null; })
    .filter(x=>x && x.s>=Math.min(1,0.6)).sort((x,y)=>y.s-x.s || x.a.n.length-y.a.n.length).slice(0,6).map(x=>x.a);
}
function acHide(){ if(AC){ AC.box.remove(); AC=null; } }
function acShow(ta){
  const line=acCurrentLine(ta); const items=acFind(line.text);
  if(!items.length){ acHide(); return; }
  if(!AC || AC.ta!==ta){ acHide(); const box=document.createElement("div"); box.className="acbox"; box.setAttribute("role","listbox"); ta.parentElement.insertBefore(box, ta.nextSibling); AC={ta, box, items:[], idx:0}; }
  AC.items=items; AC.idx=0; AC.line=line;
  AC.box.innerHTML=`<div class="achd">Схожі формулювання з довідника · ↑↓ і Enter, Esc — сховати</div>`+items.map((a,i)=>`<div class="acit${i===0?" on":""}" role="option" data-aci="${i}">${esc(a.n)}</div>`).join("");
}
function acPick(i){
  if(!AC) return; const a=AC.items[i]; const ta=AC.ta; const {a:st,e}=acCurrentLine(ta);
  ta.value = ta.value.slice(0,st) + a.n + ta.value.slice(e);
  const pos=st+a.n.length; ta.setSelectionRange(pos,pos);
  acHide(); ta.dispatchEvent(new Event("input",{bubbles:true})); ta.focus();
}
document.addEventListener("keydown", e=>{
  if(!AC || e.target!==AC.ta) return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); AC.idx=(AC.idx+(e.key==="ArrowDown"?1:-1)+AC.items.length)%AC.items.length; AC.box.querySelectorAll(".acit").forEach((el,i)=>el.classList.toggle("on",i===AC.idx)); }
  else if(e.key==="Enter"||e.key==="Tab"){ e.preventDefault(); acPick(AC.idx); }
  else if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); acHide(); }
}, true);
document.addEventListener("mousedown", e=>{ const it=e.target.closest?.(".acit"); if(it){ e.preventDefault(); acPick(+it.dataset.aci); } else if(AC && !e.target.closest(".acbox") && e.target!==AC.ta) acHide(); });
document.addEventListener("input", e=>{ if(e.target.matches?.('.prog textarea[data-f="act"]')) acShow(e.target); else if(AC && e.target!==AC.ta) acHide(); });
document.addEventListener("focusout", e=>{ if(AC && e.target===AC.ta) setTimeout(()=>{ if(AC && document.activeElement!==AC.ta) acHide(); },150); });

/* short hints for a first-time author, one per step */
const HINTS = {
  1:"Ліворуч задайте модулі й теми програми. У матриці позначте, які орієнтири для оцінювання досягатимуться в кожній темі (стовпець — тема); орієнтир може належати кільком темам, а непозначені підсвічено жовтим.",
  2:"Для кожної теми заповніть таблицю. Рядок об’єднує орієнтири, для яких спільні зміст і види діяльності; рядки можна додавати, об’єднувати, а орієнтири переносити між ними. Коди орієнтирів біля видів діяльності та рівні — лише для вашого контролю й аналізу, у документ вони не потрапляють.",
  3:"Для кожної теми оберіть інструменти формувального оцінювання за етапами та види підсумкових робіт для груп результатів (ГР), що є в темі. ★ підказує інструменти, які підтримують види діяльності, обрані на кроці 2; таблиця вгорі показує, скільки разів оцінюється кожна група.",
  4:"Перегляньте готову програму: таблиці за темами, а в кінці — розділ «Планування оцінювання». Завантажте .docx або скопіюйте таблиці; у меню «Експорт» є також Excel. Щоб продовжити роботу на іншому пристрої, збережіть файл проєкту (меню «Проєкт»)."
};
function addHint(n){
  const m=$("#main"); if(!m || S.ui.noHints || (n===1 && !S.outcomes.length)) return;
  m.insertAdjacentHTML("afterbegin", `<div class="hintbar" role="note"><span class="hi">i</span><p>${esc(HINTS[n])}</p><button class="btn small ghost" data-hidehints="1" title="Сховати підказки на всіх кроках">Сховати</button></div>`);
}
for(const [n,name] of [[1,"renderStep1"],[2,"renderStep2"],[3,"renderAssess"],[4,"renderStep3"]]){
  const orig = window[name] || eval(name);
  const wrapped = function(){ const r=orig.apply(this, arguments); addHint(n); return r; };
  eval(name+" = wrapped");
}
migrate();
applyDir();
render();
save();
</script>
