<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор навчальної програми</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
/* VOICE: спокійний робочий інструмент учителя; підказки як нотатки на берегах документа
   IDEA: аркуш навчальної програми — три частини документа, які вчитель заповнює по черзі
   PICTURE: сам робочий аркуш: блоки частин програми, таблиця тем, рубрики
   COLOUR and TYPE: темно-синій #16325c + бірюзовий #0f7f81 + бурштин для незавершеного; Unbounded для заголовків, Golos Text для тексту
   LAYOUT: смуга з назвою й кроками вгорі, нижче — одна колонка робочого аркуша до 1240px */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0d1a2e);--paper:light-dark(#ffffff,#13233d);--sheet:light-dark(#f2f6f7,#0f1e35);
--ink:light-dark(#14213a,#e6edf5);--mute:light-dark(#5b6678,#9fb0c6);--line:light-dark(#d9e1e6,#2a3d5c);
--navy:#16325c;--teal:light-dark(#0f7f81,#3cc0c2);--tealbg:light-dark(#e3f3f3,#123a45);
--amber:light-dark(#9a5b00,#f2b54a);--amberbg:light-dark(#fff3dc,#3a2d12);--ok:light-dark(#1b7a3d,#6fd08f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Golos Text",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Unbounded,"Golos Text",sans-serif;font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--navy);color:#fff;padding:22px max(4vw,16px) 0}
.top h1{font-size:clamp(22px,3vw,32px)}
.top p{margin:6px 0 16px;color:#c9d6ea;max-width:70ch}
.steps{display:flex;gap:4px;overflow-x:auto;max-width:1240px}
.steps button{flex:none;border:0;background:transparent;color:#c9d6ea;padding:12px 16px 14px;border-radius:10px 10px 0 0;cursor:pointer;min-height:44px;font-weight:500}
.steps button b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#ffffff22;margin-right:8px;font-size:13px}
.steps button[aria-current=true]{background:var(--sheet);color:var(--ink)}
.steps button[aria-current=true] b{background:var(--teal);color:#fff}
.steps .pc{font-size:13px;opacity:.75;margin-left:6px}
main{background:var(--sheet);min-height:70vh;padding:28px max(4vw,16px) 120px}
.wrap{max-width:1240px;margin:0 auto}
.lead{margin-bottom:18px}
.lead h2{font-size:clamp(20px,2.4vw,26px)}
.lead p{margin:6px 0 0;color:var(--mute);max-width:78ch}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.bh{display:flex;gap:12px;align-items:flex-start}
.code{flex:none;font:600 14px Unbounded,sans-serif;background:var(--tealbg);color:var(--teal);border-radius:8px;padding:6px 8px}
.bh h3{font-size:17px;flex:1;padding-top:3px}
.pts{flex:none;font-size:13px;color:var(--mute);padding-top:5px;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--line);vertical-align:middle}
.dot.part{background:var(--amber)}.dot.full{background:var(--ok)}
.grp{font-weight:600;margin:18px 0 0;font-size:15px;color:var(--teal)}
.fld{margin-top:14px}
.fld>label{display:block;font-weight:500;font-size:15px;margin-bottom:4px}
.fld .sub{font-size:13px;color:var(--mute);font-weight:400}
textarea,input[type=text],input[type=number],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:16px;line-height:1.45}
textarea{resize:vertical;min-height:72px;overflow:hidden}
textarea:focus,input:focus,select:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.hints{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.hints span{font-size:13px;color:var(--mute);margin-right:2px}
.hint{border:1px dashed var(--teal);background:transparent;color:var(--teal);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;min-height:32px;text-align:left}
.hint:hover{background:var(--tealbg)}
.todo{font-size:13px;color:var(--amber);margin-top:4px;display:none}
.todo.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:44px;font-weight:400;margin:0}
.chips input{accent-color:var(--teal);width:18px;height:18px}
.chips label:has(input:checked){border-color:var(--teal);background:var(--tealbg)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:44px;font-weight:500}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.sm{min-height:36px;padding:5px 10px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.drop{border:2px dashed var(--line);border-radius:16px;padding:34px 20px;text-align:center;background:var(--paper);cursor:pointer}
.drop.on{border-color:var(--teal);background:var(--tealbg)}
.drop h3{font-size:19px;margin-bottom:8px}
.drop p{color:var(--mute);margin:0 0 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:0 18px}
.note{background:var(--amberbg);border-radius:10px;padding:10px 14px;font-size:14px;margin:10px 0}
.okn{background:var(--tealbg);border-radius:10px;padding:10px 14px;font-size:15px;margin:10px 0}
details.ref{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
details.ref summary{padding:14px 18px;cursor:pointer;font-weight:500;min-height:44px}
details.ref textarea{border:0;border-top:1px solid var(--line);border-radius:0 0 14px 14px;min-height:220px;max-height:420px;overflow:auto;font-size:15px;background:transparent}
/* рубрики */
.rub{margin-top:8px;overflow-x:auto}
.rub table{border-collapse:separate;border-spacing:4px;width:100%;min-width:720px}
.rub th{font-size:13px;color:var(--mute);font-weight:600;text-align:left;padding:2px 4px;vertical-align:bottom}
.rub th input{font-size:14px;font-weight:600;padding:6px 8px;color:var(--ink)}
.rub td{vertical-align:top}
.rub td textarea{min-height:64px;font-size:14px;padding:8px}
.rub td input{font-size:14px;padding:6px 8px;margin-top:4px}
.rub .ib{margin-top:4px}
.rubbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:6px;font-size:14px}
.rubbar select{width:auto;padding:6px 8px;font-size:14px}
/* основна частина */
.bar{position:sticky;top:0;z-index:5;background:var(--sheet);padding:10px 0;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;border-bottom:1px solid var(--line)}
.sum{font-size:15px}.sum b{font:600 20px Unbounded,sans-serif}
.sum.bad b{color:var(--amber)}.sum.good b{color:var(--ok)}
.plan{display:flex;align-items:center;gap:8px;font-size:15px}.plan input{width:90px}
.it{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.it.drag{opacity:.4}.it.over-top{box-shadow:0 -3px 0 var(--teal)}.it.over-bot{box-shadow:0 3px 0 var(--teal)}
.ih{display:flex;gap:8px;align-items:center;padding:8px 10px}
.hd{cursor:grab;color:var(--mute);font-size:20px;padding:6px 4px;user-select:none}
.num{font:600 13px Unbounded,sans-serif;color:var(--teal);flex:none;min-width:28px}
.ih input.nm{flex:1;border-color:transparent;background:transparent;font-weight:600;padding:8px}
.ih input.nm:hover{border-color:var(--line)}
.hrs{display:flex;align-items:center;gap:4px;flex:none;font-size:14px;color:var(--mute)}
.hrs input{width:70px;text-align:right;padding:8px}
.it.sec{background:var(--navy);border-color:var(--navy);color:#fff}
.it.sec input.nm{color:#fff;font-family:Unbounded,sans-serif;font-weight:500}
.it.sec .hd,.it.sec .ib,.it.sec .hrs{color:#c9d6ea}
.ib{border:0;background:transparent;cursor:pointer;width:36px;height:36px;border-radius:8px;flex:none;color:var(--mute);font-size:16px}
.ib:hover{background:var(--tealbg);color:var(--teal)}
.ib[disabled]{opacity:.3;cursor:default}
.tg{flex:none;border:1px solid var(--teal);color:var(--teal);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;cursor:pointer;min-height:36px;white-space:nowrap}
.tg[aria-expanded=true]{background:var(--teal);color:#fff}
.tags{display:flex;gap:6px;flex:none;flex-wrap:wrap}
.tag{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--tealbg);color:var(--teal);font-weight:600;white-space:nowrap}
.tag.w{background:var(--amberbg);color:var(--amber)}
.ibody{border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;grid-template-columns:1.25fr 1fr 1fr .8fr;gap:14px}
.col h4{margin:0 0 6px;font-size:13px;color:var(--mute);font-weight:600}
.li{display:flex;gap:2px;align-items:flex-start;margin-bottom:4px}
.li textarea{min-height:0;padding:6px 8px;font-size:14px;border-radius:8px;border-color:transparent;background:var(--sheet)}
.li textarea:hover{border-color:var(--line)}
.li.del textarea{text-decoration:line-through;opacity:.5}
.li.chg textarea{border-left:3px solid var(--teal)}
.li.todo2 textarea{border-left:3px solid var(--amber)}
.li .ops{display:flex;flex-direction:column}
.li .ib{width:26px;height:22px;font-size:12px}
@media(hover:hover){.li .ops{opacity:.35}.li:hover .ops,.li:focus-within .ops{opacity:1}}
.gl{font-size:12px;font-weight:600;color:var(--teal);margin:8px 0 2px;display:flex;align-items:center;justify-content:space-between}
.gl .ib{width:24px;height:22px;font-size:12px}
.col .tools textarea{font-size:14px;min-height:96px}
.flags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.flags .chips label{min-height:36px;padding:4px 12px;font-size:14px}
.legend{font-size:13px;color:var(--mute);margin:-2px 0 10px}
@media(max-width:1000px){.ibody{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.ibody{grid-template-columns:minmax(0,1fr)}.ih{flex-wrap:wrap}.ih input.nm{flex-basis:60%}.steps .pc{display:none}}
/* оцінювання */
.asx{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:12px}
.ash{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.asx h4{margin:0;font-size:15px;color:var(--ink)}
.asub{font-weight:600;font-size:14px;margin:14px 0 4px;color:var(--teal)}
.grbar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.pill{font-size:13px;border-radius:999px;padding:3px 10px;background:var(--sheet);border:1px solid var(--line)}
.ablk{margin:6px 0 8px}
.abn{font-size:13px;font-weight:600;margin-bottom:4px;cursor:default}
details.ablk summary.abn{cursor:pointer;color:var(--teal);min-height:32px;display:flex;align-items:center}
.astage{margin:6px 0}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;min-height:32px;text-align:left}
.tchip.rec{border-color:var(--teal)}
.tchip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.tgr{font-size:11px;opacity:.75;margin-left:6px}
.tiny{font-size:13px}
.fsel{display:flex;align-items:center;gap:8px;font-size:14px}.fsel select{width:auto;padding:6px 8px;font-size:14px}
.gsrc{font-size:13px;color:var(--mute);margin:-4px 0 10px}.gsrc a{color:var(--teal)}
/* перевірка */
table.chk{width:100%;border-collapse:collapse;font-size:15px}
table.chk th,table.chk td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
table.chk th{font-size:13px;color:var(--mute);font-weight:600}
table.chk td.n{text-align:right;white-space:nowrap}
table.chk tr.g td{font-weight:600;background:var(--sheet)}
table.chk select{width:auto;padding:6px 8px}
.total{display:flex;flex-wrap:wrap;gap:18px;align-items:baseline;margin:4px 0}
.total b{font:600 40px Unbounded,sans-serif;color:var(--teal)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:50;max-width:calc(100vw - 32px);box-shadow:0 8px 24px #0004}
.toast button{background:#ffffff22;border:0;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;min-height:36px}
.muted{color:var(--mute)}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.it{transition:box-shadow .15s}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>Конструктор навчальної програми</h1>
    <p>Завантажте модельну програму — і складіть на її основі власну: допишіть вступну й прикінцеву частини, розподіліть години, упорядкуйте теми, уточніть зміст і види діяльності.</p>
    <nav class="steps" id="steps" aria-label="Кроки"></nav>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<div id="toastHost"></div>
<input type="file" id="fDocx" accept=".docx" hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>

<script>
{
/* ================= блоки вступної й прикінцевої частин і підказки =================
   поле: {k, l (назва), s (уточнення), o (варіанти вибору), h (підказки-заготовки; «…» треба дописати), rub (рубрика)} */
const INTRO=[
 {c:"А1",t:"Мета та обґрунтування актуальності",m:5,f:[
  {k:"goal",l:"Мета",s:"у компетентнісному ключі, з опорою на Державний стандарт; не перелік тем",h:[
   "Сформувати в учнів здатність … (що вони вмітимуть робити) для розв’язання задач у … (сфера профілю).",
   "Мета узгоджена з групами результатів Державного стандарту: ГР … — ….",
   "Курс розвиває ключові компетентності: … (інформаційно-цифрову, підприємливість, …)."]},
  {k:"why",l:"Обґрунтування актуальності",s:"конкретні потреби учнів, закладу, цифрового суспільства, ринку праці",h:[
   "Потреби учнів: … (за результатами анкети чи вхідної діагностики).",
   "Потреби закладу: … (профіль, освітня програма, наявні ресурси).",
   "Виклики цифрового суспільства: ….",
   "Ринок праці: … (за даними DOU, Work.ua, звітів роботодавців)."]},
  {k:"tasks",l:"Завдання",s:"що конкретизує досягнення мети",h:[
   "Сформувати в учнів уміння …, потрібні для … (ГР …).",
   "Розвинути здатність … через … (проєктну, дослідницьку, командну діяльність).",
   "Створити умови для … (роботи з реальними даними, професійних проб, співпраці з партнерами).",
   "Навчити учнів відповідально … (використовувати ШІ, дотримуватися академічної доброчесності, дбати про безпеку)."]}]},
 {c:"А2",t:"Місце предмета (курсу) в освітній траєкторії",m:5,f:[
  {k:"level",l:"Рівень",o:["Основний","Поглиблений"]},
  {k:"status",l:"Статус",o:["Базовий предмет","Профільний предмет","Вибірковий курс за профілем","Вибірковий курс поза профілем"]},
  {k:"scope",l:"Профіль(і) та обсяг",auto:"grades",h:["Профіль: …; обсяг: … год на тиждень (… год на рік)."]},
  {k:"pre",l:"Передумови",s:"що учні мають уміти до початку навчання",h:[
   "Учні вже вміють … (результати базової середньої освіти).",
   "Для учнів без потрібного досвіду передбачено адаптаційний старт: …."]},
  {k:"links",l:"Узгодження з іншими предметами й курсами",s:"без дублювання змісту",h:[
   "Курс входить до пакета: … → … → … (наступність: складність зростає).",
   "Не дублює базове ядро: … вивчають у …, а в цьому курсі — ….",
   "Інтеграція з … (предмет, галузь): спільне завдання …."]}]},
 {c:"А3",t:"Адаптація до профілю та освітніх потреб",m:5,f:[
  {k:"how",l:"Як змінюються зміст, приклади й завдання залежно від профілю",h:[
   "Для … профілю зміст наповнюємо прикладами з …: ….",
   "Одна структура завдання — різні набори даних чи контексти: для … — …, для … — ….",
   "Учні обирають контекст або формат продукту: …."]},
  {k:"needs",l:"Освітні потреби учнів",s:"з опорою на реальний контингент закладу",h:[
   "У класі … учнів; серед них … (нові учні з інших шкіл, після перерви в навчанні, з різних програм).",
   "Цифрові можливості учнів: … (комп’ютер, лише смартфон, стабільність інтернету).",
   "Плани учнів після школи: …."]}]},
 {c:"А4",t:"Компетентнісне завдання і навчальний проєкт",m:6,f:[
  {k:"#",l:"Компетентнісне завдання"},
  {k:"kz_name",l:"Назва завдання"},
  {k:"kz_res",l:"Результати навчання, які перевіряє завдання",s:"один-два, з індексами",h:["… [індекс]; … [індекс]."]},
  {k:"kz_ctx",l:"Життєвий контекст і стимул",h:[
   "Ситуація з досвіду підлітків: … (шкільне життя, громада, хобі, соцмережі, перша робота).",

const RX_TOPIC=/^тема\s*(?:\d+(?:\.\d+)*)?\s*[.:)\-–]?\s*/i;
const RX_END=/^(?:(?:ІІІ|III|IV|ІV|3)\.\s*)?(?:прикінцева частина|прикінцеві положення|список (?:використаних )?(?:джерел|літератури)|використані джерела|додатк)/i;
const RX_MAINHEAD=/^(?:(?:ІІ|II|2)\.\s*)?(?:основна частина|зміст (?:навчальної )?програми|зміст навчання)\.?$/i;
const hoursOf=t=>{const m=t.match(/\(\s*(\d+)\s*(?:год|г)\.?[^)]*\)\s*$/i); return m?m[1]:"";};
const cleanTopic=t=>t.replace(RX_TOPIC,"").replace(/\(\s*\d+\s*(?:год|г)\.?[^)]*\)\s*$/i,"").replace(/[\s.:]+$/,"").trim()||t.trim();
function headerMap(row){ if(row.some(x=>x.trim().length>90)) return null; const h=row.map(norm); const find=re=>h.findIndex(x=>re.test(x));
  const res=find(/^(?:очікуван\S*\s+)?результат/), cont=find(/^(?:пропонован\S*\s+|навчальн\S*\s+)?зміст/), act=find(/^(?:види|форми|пропонован\S*\s+види)?\s*(?:навчальн\S*\s+)?(?:діяльн|роботи)/);
  if(res<0||(cont<0&&act<0)) return null; return {res,cont,act,topic:find(/^тем|назва теми|^розділ|^модуль/),n:row.length}; }
const isCritTable=rows=>rows[0]&&rows[0].length>1&&/^(?:[А-ЯІЇЄҐ]{2,5})\s*\d$/.test((rows[0][1]||"").trim());

function parseProgramme(items){
  const mods=[]; let mod=null,topic=null,started=false,ended=false,lastNum=0,title="",authors="",cmap=null,pendMod=null,pendTopic=null,firstT=-1,endAt=-1,lastT=-1;
  const newModule=name=>{mod={name,topics:[]};mods.push(mod);topic=null;};
  const newTopic=(name,synth)=>{ if(!mod) newModule(pendMod||""); topic={name:synth?"":cleanTopic(name),hours:synth?"":hoursOf(name),rows:[]}; mod.topics.push(topic); };
  const moduleName=t=>{const m=t.match(/(\d{1,2})\s*[-–]?\s*(?:й\s*)?клас/i); if(m){lastNum=+m[1]; return `${m[1]} клас`;} return t.replace(/^[IVXІ]+\.\s*/,"");};
  items.forEach((it,idx)=>{
    if(it.k==="p"){ const t=it.t; if(!t) return;
      if(!title){const q=t.match(/«([^»]{3,160})»/); if(q&&!/рекомендовано|гриф/i.test(q[1])) title=q[1];}
      if(!authors&&!started){const a=t.match(/автор(?:и|ка|ський колектив|и-укладачі)?\s*[:–-]?\s+([^()]{5,200}?)\s*\)?\s*$/i); if(a&&/[А-ЯІЇЄҐ]\.\s*[А-ЯІЇЄҐ]?\.?/.test(a[1])) authors=a[1].replace(/[\s.;,]+$/,"")+(/\.$/.test(a[1].trim())?".":"");}
      if(t.length>120) return;
      if(started&&!ended&&RX_END.test(t)){ended=true; endAt=idx; return;}
      if(ended) return;
      const isMod=RX_MODULE.test(t)||(/^клас$/i.test(t)&&lastNum);
      const name=/^клас$/i.test(t)?`${++lastNum} клас`:(isMod?moduleName(t):null);
      if(!started){ if(isMod){pendMod=name;pendTopic=null;} else if(RX_TOPIC.test(t)) pendTopic=t; return; }
      if(isMod){newModule(name);return;}
      if(RX_MAINHEAD.test(t)) return;
      if(RX_TOPIC.test(t)||(it.lvl!==null&&it.lvl>=1&&t.length<=100)){newTopic(t);return;}
      if(it.lvl===0&&t.length<=100){newModule(t);return;}
      return; }
    if(ended) return;
    const rows=it.rows.filter(r=>r.some(x=>x.trim())); if(!rows.length) return;
    const hi=rows.findIndex(r=>headerMap(r)); const hm=hi>=0?headerMap(rows[hi]):null;
    if(!started&&!hm) return;
    if(isCritTable(rows)) return;
    if(hm) cmap=hm;
    if(!hm&&rows.every(r=>r.length<3)) return;
    if(!started){started=true; firstT=idx; if(pendMod) newModule(pendMod); if(pendTopic) newTopic(pendTopic);}
    lastT=idx; let first=true;
    for(let ri=0;ri<rows.length;ri++){ const cells=rows[ri].map(x=>x.trim());
      if(ri===hi){first=false;continue;}
      const nonEmpty=cells.filter(Boolean);
      if(cells.length===1||(nonEmpty.length&&cells.every(x=>x===cells[0]))||(nonEmpty.length===1&&cells.length>=3&&cells[0]&&!first&&cells[0].length<=120&&!/[.;]$/.test(cells[0])&&!/\[/.test(cells[0]))){
        const t=(nonEmpty[0]||"").replace(/\s+/g," "); if(!t||/^очікувані/i.test(t)){first=false;continue;}
        if(RX_MODULE.test(t)) newModule(moduleName(t)); else newTopic(t); first=false; continue; }
      const map=(cmap&&cmap.n===cells.length)?cmap:{res:cells.length-3,cont:cells.length-2,act:cells.length-1,topic:cells.length>3?0:-1};
      if(cells.length<3){first=false;continue;}
      if(map.topic>=0&&cells[map.topic]&&(!topic||cleanTopic(cells[map.topic])!==topic.name)) newTopic(cells[map.topic].split("\n")[0]);
      const a=cells[map.res]||"",b=map.cont>=0?(cells[map.cont]||""):"",c=map.act>=0?(cells[map.act]||""):"";
      if(!a&&!b&&!c){first=false;continue;}
      if(!topic) pendTopic?newTopic(pendTopic):newTopic("",true);
      const cont=first&&topic.rows.length&&([a,b,c].some(startsCont)||(!b&&!c));
      if(cont){const pr=topic.rows[topic.rows.length-1]; [a,b,c].forEach((x,i)=>{ if(x) pr[i]=(pr[i]+(startsCont(x)?" ":"\n")+x).trim(); });}
      else topic.rows.push([a,b,c]);
      first=false; } });
  mods.forEach(m=>m.topics=m.topics.filter(t=>t.rows.length));
  return {title,authors,mods:mods.filter(m=>m.topics.length),firstT,endAt,lastT};
}
const itemText=it=>it.k==="p"?it.t:it.rows.map(r=>r.map(x=>x.replace(/\n/g," ")).join(" | ")).join("\n");
function refTexts(items,p){
  if(p.firstT<0) return {intro:"",final:""};
  let a=p.firstT; while(a>0&&items[a-1].k==="p"&&(!items[a-1].t||(items[a-1].t.length<=120&&(RX_MODULE.test(items[a-1].t)||RX_TOPIC.test(items[a-1].t)||RX_MAINHEAD.test(items[a-1].t))))) a--;
  const b=p.endAt>=0?p.endAt:p.lastT+1;
  const pick=arr=>arr.map(itemText).filter(x=>x.trim()).join("\n\n");
  return {intro:pick(items.slice(0,a)),final:pick(items.slice(b))};
}
const L=(t,orig=true,extra={})=>({t,o:orig?t:null,d:false,...extra});
function buildItems(p){
  const out=[]; const many=p.mods.length>1||p.mods.some(m=>m.name);
  for(const m of p.mods){
    if(many&&m.name) out.push({id:uid("s"),k:"sec",name:m.name});
    for(const t of m.topics){
      const res=parseOutcomes(t.rows.map(r=>r[0]).filter(Boolean).join("\n")), cont=joinLines(t.rows.map(r=>r[1]).join("\n")), act=splitActs(joinLines(t.rows.map(r=>r[2]).join("\n")));
      out.push({id:uid("t"),k:"topic",name:t.name||"Тема",orig:t.name||"",hours:t.hours||"",res:res.map(x=>L(x.t,true,x.g?{g:true}:{})),cont:cont.map(x=>L(x)),act:act.map(x=>L(x)),tools:"",kz:false,pr:false}); } }
  return out;
}
async function importDocx(file){
  if(!window.JSZip){toast("Бібліотека для читання Word не завантажилася. Перевірте інтернет і перезавантажте сторінку.");return;}
  try{
    const zip=await JSZip.loadAsync(await file.arrayBuffer()); const f=zip.file("word/document.xml"); if(!f) throw new Error("це не документ Word (.docx)");
    const doc=new DOMParser().parseFromString(await f.async("string"),"application/xml"); const body=doc.getElementsByTagNameNS(WNS,"body")[0];
    const items=docxItems(body); const p=parseProgramme(items);
    if(!p.mods.length) throw new Error("у документі не знайдено таблиці зі стовпцем «Очікувані результати навчання»");
    const hasWork=S.items.length||Object.values(S.intro).some(Boolean)||Object.values(S.final).some(Boolean);
    const prev=JSON.stringify(S);
    const keep={intro:S.intro,final:S.final,meta:S.meta,rub:S.rub,sources:S.sources,field:S.field};
    S=blank(); Object.assign(S,keep);
    const name=p.title?`«${p.title}»`:file.name.replace(/\.docx$/i,"");
    S.meta={...keep.meta,model:name+(p.authors?` (автори ${p.authors})`:"")};
    const gm=(p.title||"").match(/^(.*?)[.,]?\s*(\d{1,2}(?:\s*[–-]\s*\d{1,2})?\s*клас\S*)\s*$/i);
    if(!S.meta.title) S.meta.title=gm?gm[1].trim():(p.title||"");
    if(!S.meta.grades&&gm) S.meta.grades=gm[2].replace(/\s*[–-]\s*/,"–");
    if(!S.meta.year) S.meta.year=String(new Date().getFullYear());
    S.items=buildItems(p); S.ref=refTexts(items,p); S.step=0; save(); render();
    const nT=S.items.filter(x=>x.k==="topic").length;
    toast(`Розпізнано тем: ${nT}. Перевірте назву й авторів модельної програми нижче.`, hasWork?()=>{S=JSON.parse(prev);save();render();}:null);
  }catch(e){toast("Не вдалося прочитати файл: "+e.message);}
}

const rubDone=r=>r.rows.length>0&&r.rows.every(x=>done(x.c)&&x.d.every(done));
const fDone=(f,obj,c)=>f.rub?rubDone(S.rub[f.rub]):done(obj[c+"."+f.k]);
const realF=b=>b.f.filter(x=>x.k!=="#");
const blockState=(b,obj)=>{const ks=realF(b); const n=ks.filter(f=>fDone(f,obj,b.c)).length; return n===0?"":n===ks.length?"full":"part";};
const partPct=(blocks,obj)=>{let a=0,n=0; for(const b of blocks) for(const f of realF(b)){ n++; if(fDone(f,obj,b.c)) a++; } return n?Math.round(a/n*100):0;};
const topics=()=>S.items.filter(x=>x.k==="topic");
const live=arr=>arr.filter(x=>!x.d&&String(x.t||"").trim());
const liveO=t=>live(t.res).filter(x=>!x.g);
function mainPct(){ const T=topics(); if(!T.length) return 0; let a=0; for(const t of T){ a+=[liveO(t).length,live(t.cont).length,live(t.act).length&&live(t.act).every(x=>done(x.t)),String(t.tools).trim(),String(t.hours).trim()].filter(Boolean).length; } return Math.round(a/(T.length*5)*100); }

const FIELD_NAMES={"ІФО":"Інформатична","МОВ":"Мовно-літературна","ІНО":"Іншомовна","МАО":"Математична","ПРО":"Природнича","ТЕО":"Технологічна","СЗО":"Соціальна і здоров’язбережувальна","ГІО":"Громадянська та історична","МИО":"Мистецька","ФІО":"Фізична культура"};
const IDX_RE=/\[\s*(\d{1,2})\s*([А-ЯІЇЄҐ]{2,5})\s*(\d+)\s*\.\s*(\d+)/g;
const fieldOfSubj=s=>FIELD_NAMES[s]?s:(/^ІН/.test(s)?"ІНО":null);
const fieldGroups=F=>F==="ІФО"?["1","2","3","4"]:Object.keys(AG[F]?.gr||{});
const codeKeys=(F,g,s)=>F==="ІФО"?["ІФО:"+g]:AG[F]?(AG[F].map[g+"."+s]||AG[F].map[g]||[g]).filter(x=>AG[F].gr[x]).map(x=>F+":"+x):[];
function rawKeys(it){ const m=new Map(); for(const x of liveO(it)){ const seen=new Set(); let r; IDX_RE.lastIndex=0;
    while((r=IDX_RE.exec(x.t))){ const F=fieldOfSubj(r[2]); if(!F) continue; for(const k of codeKeys(F,r[3],r[4])){ if(seen.has(k)) continue; seen.add(k); m.set(k,(m.get(k)||0)+1); } } }
  return m; }
function detectField(){ const c={}; for(const t of topics()) for(const k of rawKeys(t).keys()){ const F=k.split(":")[0]; c[F]=(c[F]||0)+1; } return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||""; }
const progField=()=>S.field||detectField();
const kSort=(a,b)=>{ const [A,ga]=a.split(":"), [B,gb]=b.split(":"); return A!==B?(A==="ІФО"?-1:B==="ІФО"?1:A.localeCompare(B,"uk")):(+ga-+gb); };
function topicKeys(it){ const m=rawKeys(it); if(!m.size){ const F=progField(); if(F) for(const g of fieldGroups(F)) m.set(F+":"+g,0); } return [...m.entries()].sort((a,b)=>kSort(a[0],b[0])); }
const kInfo=k=>{ const [F,g]=k.split(":"); return {F,g,name:F==="ІФО"?(A_GR_NAME[g]||""):(AG[F]?.gr?.[g]||"")}; };
const multiF=it=>new Set(topicKeys(it).map(([k])=>k.split(":")[0])).size>1;
const kLabel=(k,it)=>{ const {F,g}=kInfo(k); return (it&&multiF(it)?F+" · ":"")+"ГР "+g; };
const IFO_CUR=[...new Set(A_STRAT.flatMap(x=>x[2]))];
const sumList=k=>{ const {F,g}=kInfo(k); return F==="ІФО"?(A_SUM[g]||[]):(AG[F]?.sum?.[g]||AG[F]?.sum?.["*"]||[]); };
const curList=k=>{ const {F,g}=kInfo(k); return F==="ІФО"?IFO_CUR:(AG[F]?.cur?.[g]||AG[F]?.cur?.["*"]||[]); };
const tDesc=(F,t)=>AG[F]?.t?.[t]?.[0]||A_TOOLS[t]||(FORMA_SET.has(t)?"Метод з каталогу формувального оцінювання FormA.":"");
const tKeys=(F,t)=>AG[F]?.t?.[t]?.[1]||A_KEYS[t]||[];
const evid=(F,t,acts)=>{ const ks=tKeys(F,t).map(norm); return ks.length?acts.filter(a=>{ const n=norm(a); return ks.some(k=>n.includes(k)); }):[]; };
const aSt=id=>{ S.assess=S.assess||{}; const a=S.assess[id]=S.assess[id]||{f:[],s:{},note:""}; a.f=a.f||[]; a.s=a.s||{}; return a; };
function fBlocks(it){ const by=new Map();
  for(const [k] of topicKeys(it)){ const {F,g}=kInfo(k); if(!by.has(F)) by.set(F,new Map()); const M=by.get(F);
    for(const t of curList(k)){ if(!M.has(t)) M.set(t,[]); if(!M.get(t).includes(g)) M.get(t).push(g); } }
  return [...by.entries()].map(([F,M])=>({F,common:F==="ІФО"||!!AG[F]?.cur?.["*"],tools:[...M.entries()].map(([t,gs])=>({t,gs}))})).filter(B=>B.tools.length); }
function recommend(it){ const acts=live(it.act).map(x=>x.t); const r={f:{},s:{}};
  for(const B of fBlocks(it)) for(const x of B.tools){ const ev=evid(B.F,x.t,acts); if(ev.length) r.f["g:"+B.F+"|"+x.t]=ev; }
  for(const [sid] of A_STRAT) for(const t of (A_FORMA[sid]||[])){ const ev=evid("",t,acts); if(ev.length) r.f[sid+"|"+t]=ev; }
  for(const [k] of topicKeys(it)){ r.s[k]={}; for(const t of sumList(k)){ const ev=evid(kInfo(k).F,t,acts); if(ev.length) r.s[k][t]=ev; } }
  return r; }
function applyRec(it){ const a=aSt(it.id), r=recommend(it); const top=(keys,n)=>keys.map(k=>[k,(r.f[k]||[]).length]).filter(x=>x[1]).sort((x,y)=>y[1]-x[1]).slice(0,n).map(x=>x[0]);
  for(const [sid] of A_STRAT) for(const k of top((A_FORMA[sid]||[]).map(t=>sid+"|"+t),1)) if(!a.f.includes(k)) a.f.push(k);
  for(const B of fBlocks(it)) for(const k of top(B.tools.map(x=>"g:"+B.F+"|"+x.t),3)) if(!a.f.includes(k)) a.f.push(k);
  for(const [k] of topicKeys(it)){ const best=Object.entries(r.s[k]||{}).sort((x,y)=>y[1].length-x[1].length).slice(0,2).map(x=>x[0]); a.s[k]=a.s[k]||[]; for(const t of best) if(!a.s[k].includes(t)) a.s[k].push(t); }
  return Object.keys(r.f).length+Object.values(r.s).reduce((n,o)=>n+Object.keys(o).length,0); }
function assessOut(it){ const a=(S.assess||{})[it.id]; if(!a) return null;
  const ok=new Set(fBlocks(it).flatMap(B=>B.tools.map(x=>"g:"+B.F+"|"+x.t)).concat(A_STRAT.flatMap(([sid])=>(A_FORMA[sid]||[]).map(t=>sid+"|"+t))));
  const f=[...new Set(a.f.filter(k=>ok.has(k)).map(k=>k.split("|")[1]))];
  const s=topicKeys(it).map(([k])=>[k,(a.s[k]||[]).filter(t=>sumList(k).includes(t))]).filter(x=>x[1].length);
  const note=String(a.note||"").trim(); if(!f.length&&!s.length&&!note) return null; return {f,s,note}; }
function guideSources(){ const fs=new Set(topics().flatMap(t=>topicKeys(t).map(([k])=>k.split(":")[0]))); const out=[];
  if(fs.has("ІФО")) out.push(SRC_ASSESS[0]); for(const [F,G] of Object.entries(AG)) if(fs.has(F)) out.push([G.src,AG_URL(G.file)]); out.push(SRC_ASSESS[1]); return out; }
const lc=x=>/^[А-ЯІЇЄҐA-Z][а-яіїєґa-z’ʼ']/.test(x)?x[0].toLowerCase()+x.slice(1):x;

    <div class="grbar">${keys.map(([k,n])=>`<span class="pill"><b>${esc(kLabel(k,it))}</b>${kInfo(k).name?" · "+esc(kInfo(k).name):""}${n?` · орієнтирів: ${n}`:""}</span>`).join("")}</div>
    ${noIdx?`<p class="muted tiny">У результатах теми немає індексів, тому показано всі групи результатів галузі «${esc(FIELD_NAMES[F]||F)}».</p>`:""}

    const tas=view.querySelectorAll(`[data-rubc^="${w}|"]`); const last=tas[tas.length-1]; if(last){ (i===""?last:view.querySelector(`[data-rubd="${w}|${r.rows.length-1}|0"]`)).focus(); } return; }
  if(d.rubdel){ const [w,ri]=d.rubdel.split("|"); const row=S.rub[w].rows.splice(+ri,1)[0]; save(); rerenderRub(w); toast("Критерій видалено.",()=>{S.rub[w].rows.splice(+ri,0,row); save(); rerenderRub(w);}); return; }
  const a=d.act; if(!a) return;
  if(a==="openJson") $("#fJson").click();
  if(a==="sortSrc"){ const ta=$("#f_src"); const prev=S.sources||""; S.sources=srcSort(ta.value); ta.value=S.sources; autosize(ta); save(); toast("Джерела впорядковано за алфавітом.",()=>{S.sources=prev; save(); render();}); }
  if(a==="reset"){
    if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent="Так, стерти все й почати заново"; b.classList.remove("ghost"); setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent="Почати заново"; b.classList.add("ghost"); } },5000); return; }
    const prev=JSON.stringify(S); S=blank(); save(); render(); window.scrollTo(0,0);
    toast("Усе очищено. Можна завантажувати модельну програму.",()=>{S=fix(JSON.parse(prev)); save(); render();}); }
  if(a==="blankStart"){ S.items=[{id:uid("t"),k:"topic",name:"Нова тема",orig:"",hours:"",res:[],cont:[],act:[],tools:"",kz:false,pr:false}]; S.open[S.items[0].id]=true; S.step=2; save(); render(); }
  if(a==="add"){ const v=$("#preset").value; let it;
    if(v==="sec") it={id:uid("s"),k:"sec",name:"Новий розділ"};
    else { const p=PRESETS[+v]; const isPr=p[0]==="Навчальний проєкт"; it={id:uid("t"),k:"topic",name:p[1]||"Нова тема",orig:"",hours:"",res:[],cont:[],act:isPr?[L(kzLine("pr"),false,{w:"pr"})]:[],tools:"",kz:false,pr:isPr}; S.open[it.id]=true; }
    S.items.push(it); save(); rerenderList(); view.querySelector(`[data-i="${S.items.length-1}"] input.nm`)?.select(); }
  if(a==="expand"||a==="collapse"){ topics().forEach(t=>S.open[t.id]=a==="expand"); save(); render(); }
  if(a==="saveJson") saveFile(fname("json"),new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));
  if(a==="docx") exportDocx();
});
view.addEventListener("input",e=>{
  const t=e.target, d=t.dataset;
  if(t.tagName==="TEXTAREA"&&!t.readOnly) autosize(t);
  if(d.k){ const obj=d.part==="intro"?S.intro:S.final; obj[d.k]=t.value; const td=t.parentNode.querySelector(".todo"); if(td) td.classList.toggle("on",t.value.includes(TODO)); refreshDot(d.k.split(".")[0]); save(); return; }
  if(d.src){ S.sources=t.value; const td=t.parentNode.querySelector(".todo"); if(td) td.classList.toggle("on",t.value.includes(TODO)); save(); return; }
  if(d.meta){ S.meta[d.meta]=t.value; save(); if(d.meta==="plan"&&$("#sum")) $("#sum").outerHTML=sumHTML(); return; }
  if(d.nm){ S.items[+d.nm].name=t.value; save(); return; }
  if(d.h){ S.items[+d.h].hours=t.value; save(); $("#sum").outerHTML=sumHTML(); view.querySelectorAll(".it.sec").forEach(el=>{const h=secHours(+el.dataset.i); el.querySelector(".hrs").textContent=h?h+" год":"";}); renderSteps(); return; }
  if(d.tools){ S.items[+d.tools].tools=t.value; save(); renderSteps(); return; }
  if(d.anote){ aSt(d.anote).note=t.value; save(); return; }
  if(d.li){ const [id,f,ix]=d.li.split("|"); const x=topicBy(id)[f][+ix]; x.t=t.value; t.parentNode.classList.toggle("chg",x.o!==null&&t.value!==x.o); t.parentNode.classList.toggle("todo2",t.value.includes(TODO)); save(); return; }
  if(d.rubc){ const [w,ri]=d.rubc.split("|"); S.rub[w].rows[+ri].c=t.value; save(); refreshDot("В2"); return; }
  if(d.rubr){ const [w,ri]=d.rubr.split("|"); S.rub[w].rows[+ri].r=t.value; save(); return; }
  if(d.rubd){ const [w,ri,li]=d.rubd.split("|"); S.rub[w].rows[+ri].d[+li]=t.value; save(); refreshDot("В2"); return; }
  if(d.rubl){ const [w,li]=d.rubl.split("|"); S.rub[w].levels[+li]=t.value; save(); return; }
});
view.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(d.k&&t.type==="radio"){ return; }
  if(d.fl){ const [i,w]=d.fl.split("|"); const it=S.items[+i]; it[w]=t.checked;
    if(t.checked){ it.act.push(L(kzLine(w),false,{w})); S.open[it.id]=true; save(); rerenderList(); const ix=it.act.length-1; const el=view.querySelector(`[data-li="${it.id}|act|${ix}"]`); if(el) focusTodo(el); }
    else { const removed=it.act.filter(x=>x.w===w); it.act=it.act.filter(x=>x.w!==w); save(); rerenderList(); if(removed.some(x=>done(x.t))) toast("Пункт про "+(w==="kz"?"компетентнісне завдання":"проєкт")+" прибрано з видів діяльності.",()=>{it[w]=true; it.act.push(...removed); save(); rerenderList();}); } }
  if(d.rublev){ const r=S.rub[d.rublev], n=+t.value; const old=r.levels.length; if(n!==old){ r.levels=[...LEVELS[n]]; r.rows.forEach(x=>{ x.d = n>old ? [...x.d.slice(0,1),"",...x.d.slice(1)].slice(0,n) : [x.d[0]||x.d[1]?((x.d[0]||"")+(x.d[0]&&x.d[1]?" ":"")+(x.d[1]||"")):"",...x.d.slice(2)]; }); save(); rerenderRub(d.rublev); } }
  if(t.matches("[data-field]")){ S.field=t.value; save(); render(); return; }
  if(d.li||d.tools||d.anote) updateTags(t.closest(".it"));
});
view.addEventListener("change",e=>{ const t=e.target; if(t.type==="radio"&&t.dataset.k){ const obj=t.dataset.part==="intro"?S.intro:S.final; obj[t.dataset.k]=t.value; save(); refreshDot(t.dataset.k.split(".")[0]); } });
/* перетягування */
let dragI=null;
view.addEventListener("dragstart",e=>{ const h=e.target.closest("[data-drag]"); if(!h) return; dragI=+h.dataset.drag; e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",String(dragI));}catch(_){} const c=h.closest(".it"); e.dataTransfer.setDragImage(c,20,20); c.classList.add("drag"); });
const clearOver=()=>view.querySelectorAll(".over-top,.over-bot").forEach(x=>x.classList.remove("over-top","over-bot"));
view.addEventListener("dragover",e=>{ const dz=e.target.closest("#drop"); if(dz&&dragI===null){e.preventDefault(); dz.classList.add("on"); return;}
  if(dragI===null) return; const c=e.target.closest(".it"); if(!c) return; e.preventDefault(); clearOver(); const r=c.getBoundingClientRect(); c.classList.add(e.clientY<r.top+r.height/2?"over-top":"over-bot"); });
view.addEventListener("dragleave",e=>{ const dz=e.target.closest("#drop"); if(dz) dz.classList.remove("on"); });
view.addEventListener("drop",e=>{ const dz=e.target.closest("#drop");
  if(dz){ e.preventDefault(); dz.classList.remove("on"); const f=e.dataTransfer.files[0]; if(f) importDocx(f); return; }
  if(dragI===null) return; const c=e.target.closest(".it"); if(!c) return; e.preventDefault(); const r=c.getBoundingClientRect(); let to=+c.dataset.i+(e.clientY<r.top+r.height/2?0:1);
  const it=S.items.splice(dragI,1)[0]; if(to>dragI) to--; S.items.splice(to,0,it); dragI=null; save(); rerenderList(); });
view.addEventListener("dragend",()=>{ dragI=null; clearOver(); view.querySelectorAll(".drag").forEach(x=>x.classList.remove("drag")); });
view.addEventListener("keydown",e=>{ if(e.target.id==="drop"&&(e.key==="Enter"||e.key===" ")){e.preventDefault(); $("#fDocx").click();} });
/* файли */
$("#fDocx").onchange=e=>{const f=e.target.files[0]; if(f) importDocx(f); e.target.value="";};
$("#fJson").onchange=async e=>{const f=e.target.files[0]; e.target.value=""; if(!f) return; try{const o=JSON.parse(await f.text()); if(!o||o.v!==1||!Array.isArray(o.items)) throw 0; const prev=JSON.stringify(S); S=fix(o); save(); render(); toast("Проєкт відкрито.",()=>{S=JSON.parse(prev);save();render();});}catch(_){toast("Це не файл проєкту цього конструктора.");}};
const fname=ext=>((["Навчальна програма",S.meta.title,S.meta.grades].map(x=>String(x||"").trim()).filter(Boolean).join(". ")).replace(/[\\/:*?"<>|«»]+/g,"").replace(/\s+/g," ").trim().slice(0,80)||"Навчальна програма")+"."+ext;
let DL=null; try{ window.claude?.use?.("downloads").then(x=>DL=x).catch(()=>{}); }catch(_){}
async function saveFile(name,blob){
  if(DL){ try{ await DL.save({filename:name,data:blob}); toast("Файл збережено."); return; }catch(e){ if(e&&e.code==="declined") return; if(e&&e.code==="host_unavailable"){toast("Тут файл не зберегти — відкрийте сторінку в браузері на комп’ютері."); return;} } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500);
}

/* ================= експорт у Word =================
   оформлення за рекомендаціями (лист УІРО 26.05.2025): А4; Times New Roman 14 пт, у таблицях 12 пт; інтервал 1,0;
   поля: ліве 30 мм, праве 10 мм, верхнє й нижнє 20 мм; вирівнювання за шириною (крім титулу);
   нумерація з титулу, номер — з другої сторінки; кожна частина з нової сторінки */
async function exportDocx(){
  const D=window.docx; if(!D){toast("Бібліотека для створення Word не завантажилася. Перевірте інтернет і перезавантажте сторінку.");return;}
  const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,PageOrientation,AlignmentType,HeadingLevel,ShadingType,Footer,PageNumber}=D;
  const J=AlignmentType.JUSTIFIED, C=AlignmentType.CENTER;
  const P=(t,o={})=>new Paragraph({alignment:o.align||J,spacing:{after:o.after??0,before:o.before??0},keepNext:o.keepNext,children:[new TextRun({text:t,bold:o.bold,italics:o.it,allCaps:o.caps})]});
  const paras=t=>String(t||"").split(/\n+/).filter(x=>x.trim()).map(x=>P(x.trim()));
  const H=(t,l)=>new Paragraph({heading:l,children:[new TextRun({text:t})]});
  const cell=(lines,o={})=>new TableCell({columnSpan:o.span,shading:o.fill?{type:ShadingType.CLEAR,color:"auto",fill:o.fill}:undefined,width:o.w?{size:o.w,type:WidthType.PERCENTAGE}:undefined,
    children:(lines.length?lines:[""]).map(x=>{ const it=typeof x==="object"; const tx=it?x.t:x; return new Paragraph({alignment:o.center?C:AlignmentType.LEFT,children:[new TextRun({text:tx,bold:o.bold||(it&&x.b),italics:it&&x.i,size:24})]}); })});
  const rubTable=w=>{ const r=S.rub[w]; if(!r.rows.length) return []; const lw=Math.floor(72/r.levels.length);
    return [new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[new TableRow({tableHeader:true,children:[cell(["Критерій"],{bold:true,fill:"E7EEF0",w:28}),...r.levels.map(l=>cell([l],{bold:true,fill:"E7EEF0",center:true,w:lw}))]}),
      ...r.rows.map(x=>new TableRow({children:[cell([{t:x.c,b:true},...(String(x.r||"").trim()?[{t:x.r,i:true}]:[])],{w:28}),...x.d.map(d=>cell(String(d||"").split(/\n+/).filter(Boolean),{w:lw}))]}))]}),P("")]; };
  const m=S.meta;
  const part=(blocks,obj)=>blocks.flatMap(b=>{ const out=[H(b.t,HeadingLevel.HEADING_2)];
    b.f.forEach((f,fi)=>{ if(f.k==="#"){ const nx=b.f.slice(fi+1); const u=nx.findIndex(x=>x.k==="#"); if((u<0?nx:nx.slice(0,u)).some(x=>String(obj[b.c+"."+x.k]||"").trim())) out.push(H(f.l,HeadingLevel.HEADING_3)); return; }
      if(f.auto==="grades"&&String(m.grades||"").trim()) out.push(new Paragraph({alignment:J,children:[new TextRun({text:"Клас(и): ",bold:true}),new TextRun(m.grades)]}));
      if(f.rub){ const t=rubTable(f.rub); if(t.length){ out.push(P(f.l,{bold:true,keepNext:true,before:120}),...t); } return; }
      const v=obj[b.c+"."+f.k]; if(!String(v||"").trim()) return;
      if(f.o) out.push(new Paragraph({alignment:J,children:[new TextRun({text:f.l+": ",bold:true}),new TextRun(v)]}));
      else { out.push(P(f.l,{bold:true,keepNext:true,before:120})); out.push(...paras(v)); } });
    if(b.c==="В2"){ const at=assessTable(); if(at.length) out.push(P("Планування оцінювання за темами",{bold:true,keepNext:true,before:120}),...at); }
    return out.length>1?out:[]; });
  function assessTable(){ const T=topics(); if(!T.some(assessOut)) return []; let n=0;
    const rows=[new TableRow({tableHeader:true,children:[cell(["Тема"],{bold:true,fill:"E7EEF0",w:28}),cell(["Формувальне оцінювання"],{bold:true,fill:"E7EEF0",center:true,w:36}),cell(["Підсумкове оцінювання"],{bold:true,fill:"E7EEF0",center:true,w:36})]})];
    S.items.forEach((it,i)=>{ if(it.k==="sec"){ rows.push(new TableRow({children:[cell([it.name],{bold:true,span:3,fill:"F2F2F2"})]})); return; }
      n++; const o=assessOut(it)||{f:[],s:[],note:""};
      rows.push(new TableRow({children:[cell([`Тема ${n}. ${it.name}`],{w:28}),cell(o.f.length?[o.f.join(", ")]:["—"],{w:36}),
        cell([...o.s.map(([k,l])=>({t:`${kLabel(k,it)}: ${l.map(lc).join(", ")}`})),...(o.note?[o.note]:[]),...(!o.s.length&&!o.note?["—"]:[])],{w:36})]})); });
    return [new Table({width:{size:100,type:WidthType.PERCENTAGE},rows}),P("")]; }
  /* титульний аркуш */
  const model=String(m.model||"").trim();
  const name=[String(m.title||"").trim(),String(m.grades||"").trim()].filter(Boolean).join(". ");
  const title=[
    P(String(m.school||"").trim()||"Назва закладу освіти",{align:C,bold:true}),
    ...Array.from({length:9},()=>P("",{align:C})),
    P("Навчальна програма",{align:C,bold:true,caps:true,after:120}),
    P(name?`«${name}»`:"«Назва навчальної програми»",{align:C,bold:true,after:120}),
    P("для закладів загальної середньої освіти,",{align:C}),
    P("розроблена на основі модельної навчальної програми",{align:C}),
    ...(model?[P(model,{align:C})]:[]),
    ...Array.from({length:6},()=>P("",{align:C})),
    ...(String(m.author||"").trim()?[P("Автор(ка):",{align:AlignmentType.RIGHT,bold:true}),P(m.author.trim(),{align:AlignmentType.RIGHT})]:[]),
    ...Array.from({length:8},()=>P("",{align:C})),
    P(String(m.year||"").trim(),{align:C})];
  /* основна частина */
  const W=[9,25,22,25,19];
  const head=new TableRow({tableHeader:true,children:["Кількість годин","Очікувані результати навчання","Пропонований зміст","Пропоновані види навчальної діяльності","Пропоновані засоби навчання / обладнання"].map((t,c)=>cell([t],{bold:true,w:W[c],fill:"E7EEF0",center:true}))});
  const rows=[head]; let n=0;
  S.items.forEach((it,i)=>{
    if(it.k==="sec"){ const h=secHours(i); rows.push(new TableRow({children:[cell([h?String(h):""],{bold:true,w:W[0],fill:"F2F2F2",center:true}),cell([it.name],{bold:true,span:4,fill:"F2F2F2"})]})); return; }
    n++;
    rows.push(new TableRow({children:[cell([String(it.hours||"")],{bold:true,w:W[0],center:true}),cell([`Тема ${n}. ${it.name}`],{bold:true,span:4})]}));
    rows.push(new TableRow({children:[cell([],{w:W[0]}),cell(live(it.res).map(x=>x.g?{t:x.t,b:true,i:true}:x.t),{w:W[1]}),cell(live(it.cont).map(x=>x.t),{w:W[2]}),cell(live(it.act).map(x=>x.t),{w:W[3]}),cell(String(it.tools||"").split(/\n+/).filter(x=>x.trim()),{w:W[4]})]}));
  });
  rows.push(new TableRow({children:[cell([String(hoursSum())],{bold:true,w:W[0],center:true}),cell(["Разом годин"],{bold:true,span:4})]}));
  /* джерела */
  const src=String(S.sources||"").split("\n").map(x=>x.replace(/^\s*\d+[.)]\s*/,"").trim()).filter(Boolean);
  const srcPart=src.length?[H("Список використаних джерел",HeadingLevel.HEADING_1),...src.map((x,k)=>P(`${k+1}. ${x}`,{after:60}))]:[];
  const mm=x=>Math.round(x*56.6929);
  const pg={size:{width:11906,height:16838},margin:{top:mm(20),bottom:mm(20),left:mm(30),right:mm(10),footer:mm(10)}};
  const land={...pg,size:{...pg.size,orientation:PageOrientation.LANDSCAPE}};
  const num=new Footer({children:[new Paragraph({alignment:C,children:[new TextRun({children:[PageNumber.CURRENT],size:24})]})]});
  const none=new Footer({children:[new Paragraph("")]});
  const sec=(page,children,foot=num)=>({properties:{page},footers:{default:foot},children});
  const sections=[sec(pg,title,none),sec(pg,[H("Вступна частина",HeadingLevel.HEADING_1),...part(INTRO,S.intro)]),
    sec(land,[H("Основна частина",HeadingLevel.HEADING_1),new Table({width:{size:100,type:WidthType.PERCENTAGE},rows})]),
    sec(pg,[H("Прикінцева частина",HeadingLevel.HEADING_1),...part(FINAL,S.final)])];
  if(srcPart.length) sections.push(sec(pg,srcPart));
  const hs=(id,name,o)=>({id,name,basedOn:"Normal",next:"Normal",quickFormat:true,run:{size:28,bold:true,italics:o.it,color:"000000"},paragraph:{alignment:o.al,spacing:{before:o.b,after:o.a,line:240},keepNext:true}});
  const doc=new Document({creator:m.author||"",title:name||"Навчальна програма",
    styles:{default:{document:{run:{font:"Times New Roman",size:28},paragraph:{spacing:{line:240}}}},paragraphStyles:[
      hs("Heading1","Heading 1",{al:C,b:0,a:240}),hs("Heading2","Heading 2",{al:J,b:240,a:120}),hs("Heading3","Heading 3",{al:J,b:120,a:60,it:true})]},
    sections});
  try{ const blob=await Packer.toBlob(doc); await saveFile(fname("docx"),blob); }catch(e){ toast("Не вдалося створити файл: "+e.message); }
}
window.__np={get S(){return S;}};
render();
}
